/* ============================================================
   분석 탭 — 계산 기반 (학습/추정 없음, 전부 결정론적 산식)
   ============================================================ */

/* 전체 항목을 평탄화해 분석용 레코드로 변환.
   각 레코드는 "판매가 1건"에 해당하며 마진 구성요소를 모두 포함한다. */
function collectAnalysisRecords() {
  var recs = [];
  function walk(platId, platLabel, chan) {
    if (!chan) return;
    var camps = chan.campaigns || [{ id: "__std", label: chan.label }];
    camps.forEach(function (camp) {
      var key = platId + "||" + chan.id + "||" + camp.id;
      var bucket = state.channelEntries[key] || {};
      Object.keys(bucket).forEach(function (pid) {
        var e = bucket[pid];
        var prod = state.products.find(function (p) { return p.id === pid; });
        if (!prod || !e || !Number(e.price)) return;
        var m = chan.isBaby
          ? calcBabyVoucherMetrics(prod, { price: e.price, seller: e.seller }, chan.feeRate, !!chan.babyWithCoupon)
          : calcMetrics(prod, e, chan.feeRate || 0);
        if (!m || !m.price) return;
        recs.push({
          platId: platId, platLabel: platLabel,
          chanId: chan.id, chanLabel: chan.label,
          campId: camp.id, campLabel: camp.label,
          prodId: pid, prodName: prod.name, prodSize: prod.size,
          price: m.price,
          cost: (m.cost || 0) + (m.box || 0) + (m.ship || 0),
          costOnly: m.cost || 0, box: m.box || 0, ship: m.ship || 0,
          vat: m.vat || 0, feeAmt: m.feeAmt || 0,
          sellerAmt: m.sellerAmt || 0,
          platSellerAmt: m.platSellerAmt || 0,
          // 제휴바우처 채널의 바우처 할인. 이 값을 빼먹으면 구조 분해 합계가 100% 에 미달한다.
          voucher: m.voucherDiscount || 0,
          margin: m.margin || 0,
          rate: m.marginRate || 0
        });
      });
    });
  }
  (state.platformDefs || []).forEach(function (p) {
    if (p.isOtherGroup) {
      (p.subPlatforms || []).forEach(function (sp) {
        (sp.channels || []).forEach(function (c) { walk(sp.id, sp.label || sp.id, c); });
      });
    } else {
      (p.channels || []).forEach(function (c) { walk(p.id, p.label, c); });
    }
  });
  return recs;
}

/* ① 마진 구조 분해 — 판매가 100%를 무엇이 얼마나 가져가는지 */
function analyzeCostStructure(recs) {
  if (!recs.length) return null;
  var sum = { price: 0, costOnly: 0, box: 0, ship: 0, vat: 0, feeAmt: 0, coupon: 0, voucher: 0, margin: 0 };
  recs.forEach(function (r) {
    sum.price += r.price; sum.costOnly += r.costOnly; sum.box += r.box;
    sum.ship += r.ship; sum.vat += r.vat; sum.feeAmt += r.feeAmt;
    sum.coupon += r.sellerAmt + r.platSellerAmt; sum.voucher += r.voucher;
    sum.margin += r.margin;
  });
  var P = sum.price || 1;
  return {
    total: sum.price, count: recs.length,
    parts: [
      { key: "원가",   amt: sum.costOnly, pct: sum.costOnly / P },
      { key: "박스",   amt: sum.box,      pct: sum.box / P },
      { key: "택배비", amt: sum.ship,     pct: sum.ship / P },
      { key: "부가세", amt: sum.vat,      pct: sum.vat / P },
      { key: "수수료", amt: sum.feeAmt,   pct: sum.feeAmt / P },
      { key: "쿠폰",   amt: sum.coupon,   pct: sum.coupon / P },
      { key: "바우처", amt: sum.voucher,  pct: sum.voucher / P },
      { key: "마진",   amt: sum.margin,   pct: sum.margin / P }
    ]
  };
}

/* ② 손실 원인 추적 — 마진이 음수/저조한 항목의 주범 지목 */
function analyzeLossDrivers(recs) {
  var bad = recs.filter(function (r) { return r.rate < 0.10; });
  if (!bad.length) return [];
  // 채널 단위로 묶어 "가장 큰 비용 항목"을 지목
  var byChan = {};
  bad.forEach(function (r) {
    var k = r.platLabel + " · " + r.chanLabel;
    if (!byChan[k]) byChan[k] = {
      label: k, n: 0, price: 0, costOnly: 0, box: 0, ship: 0,
      vat: 0, feeAmt: 0, coupon: 0, voucher: 0, margin: 0,
      platId: r.platId, chanId: r.chanId
    };
    var b = byChan[k];
    b.n++; b.price += r.price; b.costOnly += r.costOnly; b.box += r.box;
    b.ship += r.ship; b.vat += r.vat; b.feeAmt += r.feeAmt;
    b.coupon += r.sellerAmt + r.platSellerAmt; b.voucher += r.voucher;
    b.margin += r.margin;
  });
  return Object.keys(byChan).map(function (k) {
    var b = byChan[k];
    var P = b.price || 1;
    var items = [
      { key: "원가",   pct: b.costOnly / P },
      { key: "택배비", pct: b.ship / P },
      { key: "박스",   pct: b.box / P },
      { key: "부가세", pct: b.vat / P },
      { key: "수수료", pct: b.feeAmt / P },
      { key: "쿠폰",   pct: b.coupon / P },
      { key: "바우처", pct: b.voucher / P }
    ].sort(function (x, y) { return y.pct - x.pct; });
    return {
      label: b.label, n: b.n, rate: b.margin / P,
      top: items.slice(0, 3), platId: b.platId, chanId: b.chanId
    };
  }).sort(function (a, b) { return a.rate - b.rate; });
}

/* ③ 목표 마진 미달 — 목표치까지 필요한 인상액 역산 */
function analyzeTargetGap(recs) {
  var t = (Number(state.targetMargin) || 0) / 100;
  return recs.filter(function (r) { return r.rate < t; })
    .map(function (r) {
      // 판매가만 올려 목표 달성 시 필요한 금액.
      // margin = P - C - P/11 - P*fee - coupon  →  목표 P* 역산
      var feeRate = r.price ? r.feeAmt / r.price : 0;
      var fixed = r.cost + r.sellerAmt + r.platSellerAmt + r.voucher;
      var denom = 1 - (1 / 11) - feeRate - t;
      var need = denom > 0.01 ? Math.ceil((fixed / denom) / 100) * 100 : null;
      return {
        label: r.platLabel + " · " + r.chanLabel,
        prod: r.prodName + " " + r.prodSize,
        price: r.price, rate: r.rate,
        need: need, gap: need ? need - r.price : null,
        platId: r.platId
      };
    })
    .sort(function (a, b) { return a.rate - b.rate; });
}

/* ④ 동일 상품의 플랫폼 간 가격/마진 편차 */
function analyzePriceVariance(recs) {
  var byProd = {};
  recs.forEach(function (r) {
    if (!byProd[r.prodId]) byProd[r.prodId] = { name: r.prodName + " " + r.prodSize, list: [] };
    byProd[r.prodId].list.push(r);
  });
  return Object.keys(byProd).map(function (pid) {
    var g = byProd[pid];
    if (g.list.length < 2) return null;
    var prices = g.list.map(function (r) { return r.price; });
    var rates = g.list.map(function (r) { return r.rate; });
    var minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);
    var minR = Math.min.apply(null, rates), maxR = Math.max.apply(null, rates);
    var lo = g.list.find(function (r) { return r.rate === minR; });
    var hi = g.list.find(function (r) { return r.rate === maxR; });
    return {
      name: g.name, n: g.list.length,
      minP: minP, maxP: maxP, spreadP: maxP - minP,
      minR: minR, maxR: maxR, spreadR: maxR - minR,
      loLabel: lo ? lo.platLabel + " · " + lo.chanLabel : "",
      hiLabel: hi ? hi.platLabel + " · " + hi.chanLabel : ""
    };
  }).filter(Boolean).sort(function (a, b) { return b.spreadR - a.spreadR; });
}

/* ⑤ 수수료율 변동 시뮬레이션 (What-if) */
function analyzeFeeSensitivity(recs, deltaPct) {
  if (!recs.length) return null;
  var d = deltaPct / 100;
  var base = 0, sim = 0, price = 0;
  recs.forEach(function (r) {
    price += r.price;
    base += r.margin;
    sim += r.margin - (r.price * d); // 수수료율 d 만큼 상승 시 마진 감소
  });
  return {
    baseRate: price ? base / price : 0,
    simRate: price ? sim / price : 0,
    deltaAmt: sim - base
  };
}

function setFeeSim(v) {
  state.feeSimDelta = Number(v) || 0;
  var el = document.getElementById("fee-sim-out");
  if (!el) return;
  var s = analyzeFeeSensitivity(collectAnalysisRecords(), state.feeSimDelta);
  if (!s) return;
  var col = s.simRate >= 0.15 ? "#2F6B45" : s.simRate >= 0.10 ? "#8B6000" : "#9C3B27";
  el.innerHTML = '수수료 ' + (state.feeSimDelta >= 0 ? "+" : "") + state.feeSimDelta +
    '%p 변동 시 → 전체 평균 마진율 <b class="mono" style="color:' + col + ';">' +
    pct1(s.simRate) + '</b> <span style="color:var(--muted);">(현재 ' + pct1(s.baseRate) + ')</span>' +
    ' · 마진 총액 <b class="mono" style="color:' + col + ';">' + won(Math.round(s.deltaAmt)) + '원</b>';
}

function renderAnalysisBody() {
  var recs = collectAnalysisRecords();
  if (!recs.length) {
    return '<div class="empty-state">📋 마진계산 탭에서 판매가를 입력하면 분석 결과가 표시됩니다.</div>';
  }

  var box = function (title, sub, inner, accent) {
    return '<div class="cat-table-wrap" style="padding:16px;margin-bottom:24px;' +
      (accent ? 'border-top:3px solid ' + accent + ';' : '') + '">' +
      '<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px;">' + title + '</div>' +
      (sub ? '<div style="font-size:11px;color:var(--muted);margin-bottom:12px;">' + sub + '</div>' : '') +
      inner + '</div>';
  };

  /* ① 마진 구조 분해 */
  var cs = analyzeCostStructure(recs);
  var COLORS = { "원가": "#3F5E78", "박스": "#8B8275", "택배비": "#B98B3E",
                 "부가세": "#8B6000", "수수료": "#B5651D", "쿠폰": "#9C3B27", "바우처": "#8C6526", "마진": "#2F6B45" };
  var barSeg = cs.parts.filter(function (p) { return p.pct > 0.001; }).map(function (p) {
    return '<div title="' + p.key + ' ' + pct1(p.pct) + '" style="width:' + (p.pct * 100) +
      '%;background:' + COLORS[p.key] + ';height:100%;"></div>';
  }).join("");
  var legend = cs.parts.map(function (p) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">' +
      '<span style="font-size:12px;color:var(--ink);display:flex;align-items:center;gap:7px;">' +
        '<span style="width:10px;height:10px;border-radius:2px;background:' + COLORS[p.key] + ';flex-shrink:0;"></span>' +
        (p.key === "마진" ? '<b>' + p.key + '</b>' : p.key) + '</span>' +
      '<span style="display:flex;gap:14px;flex-shrink:0;">' +
        '<span class="mono" style="font-size:12px;color:var(--muted);">' + won(Math.round(p.amt)) + '원</span>' +
        '<span class="mono" style="font-size:12px;font-weight:700;color:' + COLORS[p.key] + ';width:52px;text-align:right;">' + pct1(p.pct) + '</span>' +
      '</span></div>';
  }).join("");
  var structHtml = box("🧮 마진 구조 분해",
    "판매가 합계 " + won(cs.total) + "원 (" + cs.count + "개 항목) 을 100% 로 봤을 때의 구성비입니다.",
    '<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);">' +
      barSeg + '</div>' + legend, "#3F5E78");

  /* ② 손실 원인 추적 */
  var ld = analyzeLossDrivers(recs);
  var lossHtml = box("🩺 손실 원인 추적",
    "마진율 10% 미만 채널에서 판매가 대비 비중이 가장 큰 항목 3개를 지목합니다.",
    ld.length ? ld.map(function (d) {
      var chips = d.top.map(function (t, i) {
        return '<span style="font-size:11px;padding:2px 8px;border-radius:99px;background:' +
          (i === 0 ? "#FBE6E0" : "var(--paper)") + ';color:' + (i === 0 ? "#9C3B27" : "var(--ink-soft)") +
          ';font-weight:' + (i === 0 ? "700" : "500") + ';">' + t.key + ' ' + pct1(t.pct) + '</span>';
      }).join(" ");
      return '<div style="padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;" ' +
        'onclick="jumpToDashChannel(\'' + esc(d.platId) + '\',\'\')">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;">' +
          '<span style="font-size:12px;font-weight:700;color:var(--ink);">' + esc(d.label) +
            ' <span style="font-weight:500;color:var(--muted);">' + d.n + '개 항목</span></span>' +
          '<span class="mono" style="font-size:13px;font-weight:700;color:#9C3B27;flex-shrink:0;">' + pct1(d.rate) + '</span>' +
        '</div><div style="display:flex;gap:5px;flex-wrap:wrap;">' + chips + '</div></div>';
    }).join("") : '<div style="font-size:12px;color:var(--muted);padding:6px 0;">10% 미만 채널이 없습니다 ✓</div>',
    "#9C3B27");

  /* ③ 목표 마진 미달 */
  var tg = analyzeTargetGap(recs);
  var shown = tg.slice(0, 30);
  var gapHtml = box("🎯 목표 마진(" + (state.targetMargin || 0) + "%) 미달 항목",
    tg.length + "개 항목이 목표에 미달합니다. 판매가만 조정해 목표를 맞출 때 필요한 금액입니다." +
      (tg.length > 30 ? " (마진율이 낮은 30개만 표시)" : ""),
    shown.length ? '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:560px;">' +
      '<thead><tr style="border-bottom:1px solid var(--line);">' +
        '<th style="text-align:left;padding:6px 4px;color:var(--muted);font-weight:600;">채널</th>' +
        '<th style="text-align:left;padding:6px 4px;color:var(--muted);font-weight:600;">상품</th>' +
        '<th style="text-align:right;padding:6px 4px;color:var(--muted);font-weight:600;">현재가</th>' +
        '<th style="text-align:right;padding:6px 4px;color:var(--muted);font-weight:600;">마진율</th>' +
        '<th style="text-align:right;padding:6px 4px;color:var(--muted);font-weight:600;">권장가</th>' +
        '<th style="text-align:right;padding:6px 4px;color:var(--muted);font-weight:600;">인상액</th>' +
      '</tr></thead><tbody>' +
      shown.map(function (g) {
        var col = g.rate < 0 ? "#9C3B27" : g.rate < 0.10 ? "#9C3B27" : "#8B6000";
        return '<tr style="border-bottom:1px solid var(--line);">' +
          '<td style="padding:6px 4px;color:var(--ink-soft);">' + esc(g.label) + '</td>' +
          '<td style="padding:6px 4px;color:var(--ink);">' + esc(g.prod) + '</td>' +
          '<td class="mono" style="padding:6px 4px;text-align:right;">' + won(g.price) + '</td>' +
          '<td class="mono" style="padding:6px 4px;text-align:right;font-weight:700;color:' + col + ';">' + pct1(g.rate) + '</td>' +
          '<td class="mono" style="padding:6px 4px;text-align:right;color:#2F6B45;font-weight:700;">' +
            (g.need ? won(g.need) : '<span style="color:var(--muted);">구조상 불가</span>') + '</td>' +
          '<td class="mono" style="padding:6px 4px;text-align:right;color:var(--muted);">' +
            (g.gap ? "+" + won(g.gap) : "—") + '</td></tr>';
      }).join("") + '</tbody></table></div>'
      : '<div style="font-size:12px;color:var(--muted);padding:6px 0;">모든 항목이 목표 마진을 달성했습니다 ✓</div>',
    "#8B6000");

  /* ④ 플랫폼 간 편차 */
  var pv = analyzePriceVariance(recs).slice(0, 15);
  var varHtml = box("⚖️ 동일 상품 · 플랫폼 간 편차",
    "같은 상품이 채널에 따라 마진율이 얼마나 벌어지는지 보여줍니다. 편차가 큰 순서입니다.",
    pv.length ? pv.map(function (v) {
      return '<div style="padding:9px 0;border-bottom:1px solid var(--line);">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">' +
          '<span style="font-size:12px;font-weight:700;color:var(--ink);">' + esc(v.name) +
            ' <span style="font-weight:500;color:var(--muted);">' + v.n + '개 채널</span></span>' +
          '<span class="mono" style="font-size:12px;font-weight:700;color:#B5651D;flex-shrink:0;">편차 ' + pct1(v.spreadR) + '</span>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--muted);line-height:1.6;">' +
          '최고 <b style="color:#2F6B45;">' + pct1(v.maxR) + '</b> ' + esc(v.hiLabel) +
          ' &nbsp;·&nbsp; 최저 <b style="color:#9C3B27;">' + pct1(v.minR) + '</b> ' + esc(v.loLabel) +
          ' &nbsp;·&nbsp; 가격 ' + won(v.minP) + '~' + won(v.maxP) + '원</div></div>';
    }).join("") : '<div style="font-size:12px;color:var(--muted);padding:6px 0;">비교 가능한 상품이 없습니다.</div>',
    "#B98B3E");

  /* ⑤ 수수료 시뮬레이션 */
  var cur = state.feeSimDelta === undefined ? 0 : state.feeSimDelta;
  var s0 = analyzeFeeSensitivity(recs, cur);
  var col0 = s0.simRate >= 0.15 ? "#2F6B45" : s0.simRate >= 0.10 ? "#8B6000" : "#9C3B27";
  var simHtml = box("🔮 수수료율 변동 시뮬레이션",
    "수수료가 오르거나 내릴 때 전체 마진이 어떻게 움직이는지 즉시 계산합니다.",
    '<input type="range" min="-5" max="10" step="0.5" value="' + cur + '" ' +
      'oninput="setFeeSim(this.value)" style="width:100%;margin-bottom:12px;">' +
    '<div id="fee-sim-out" style="font-size:13px;color:var(--ink);line-height:1.7;">' +
      '수수료 ' + (cur >= 0 ? "+" : "") + cur + '%p 변동 시 → 전체 평균 마진율 ' +
      '<b class="mono" style="color:' + col0 + ';">' + pct1(s0.simRate) + '</b> ' +
      '<span style="color:var(--muted);">(현재 ' + pct1(s0.baseRate) + ')</span>' +
      ' · 마진 총액 <b class="mono" style="color:' + col0 + ';">' + won(Math.round(s0.deltaAmt)) + '원</b></div>',
    "#B5651D");

  var note = '<div style="font-size:11px;color:var(--muted);line-height:1.7;padding:0 2px 8px;">' +
    'ℹ️ 이 탭의 모든 수치는 입력된 판매가·원가·수수료로부터 <b>직접 계산</b>한 결과입니다. ' +
    '추정이나 학습 모델을 쓰지 않으므로 값이 항상 재현됩니다. ' +
    '수요 예측·최적 할인율 같은 예측 기능은 <b>예측</b> 탭에 준비되어 있으며, 판매 실적이 연동되면 활성화됩니다.</div>';

  return note + structHtml + lossHtml + gapHtml + varHtml + simHtml;
}

var _sortableInstances = { plat: null, camp: null };

function initDragSort() {
  if (typeof Sortable === "undefined") return; // SortableJS 미로드 시 무시

  // 이전 인스턴스 정리 (render마다 재생성되므로 리스너 누수 방지)
  if (_sortableInstances.plat) { try { _sortableInstances.plat.destroy(); } catch(e){} _sortableInstances.plat = null; }
  if (_sortableInstances.camp) { try { _sortableInstances.camp.destroy(); } catch(e){} _sortableInstances.camp = null; }

  // 플랫폼 탭 드래그 (calc, standard 탭에서만)
  var platTabrow = document.querySelector('.platform-tabrow');
  if (platTabrow && (state.activeTab === "calc" || state.activeTab === "standard")) {
    new Sortable(platTabrow, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function(evt) {
        var tabs = platTabrow.querySelectorAll('.platform-tab:not(:last-child)');
        var newOrder = Array.from(tabs).map(function(tab) {
          var label = tab.textContent.trim();
          return state.platformDefs.find(function(p){ return p.label === label; })?.id || null;
        }).filter(Boolean);
        if (newOrder.length > 0) {
          state.platformDefs.sort(function(a, b) {
            return newOrder.indexOf(a.id) - newOrder.indexOf(b.id);
          });
          state.platformOrder = newOrder;
          schedulePersist();
        }
      }
    });
  }
  
  // 기획전 탭 드래그
  var campTabrow = document.querySelector('.camp-tabrow-sm');
  if (campTabrow && (state.activeTab === "calc" || state.activeTab === "standard")) {
    new Sortable(campTabrow, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function(evt) {
        var tabs = campTabrow.querySelectorAll('.camp-tab-sm:not(.camp-tab-add)');
        var campaigns = state.platformDefs
          .flatMap(function(p) { return p.isOtherGroup ? (p.subPlatforms||[]) : [p]; })
          .flatMap(function(p) { return p.channels||[]; })
          .find(function(c) { return c.id === state.activeChannelId; })?.campaigns || [];
        
        var newOrder = Array.from(tabs).map(function(tab) {
          var label = tab.textContent.trim();
          return campaigns.find(function(c){ return c.label === label; })?.id || null;
        }).filter(Boolean);
        
        if (newOrder.length > 0) {
          var chan = state.platformDefs
            .flatMap(function(p) { return p.isOtherGroup ? (p.subPlatforms||[]) : [p]; })
            .flatMap(function(p) { return p.channels||[]; })
            .find(function(c) { return c.id === state.activeChannelId; });
          if (chan && chan.campaigns) {
            chan.campaigns.sort(function(a, b) {
              return newOrder.indexOf(a.id) - newOrder.indexOf(b.id);
            });
            schedulePersist();
          }
        }
      }
    });
  }
}

/* ============================================================
   AI 마진 어시스턴트 (규칙 기반 로컬 질의응답 + 자동입력 트리거)
   ※ 외부 API 없이 현재 앱 데이터만으로 답변하는 방식입니다.
   ============================================================ */

window.toggleAssistant = function() {
  state.assistantOpen = !state.assistantOpen;
  render();
};

window.pushChatMessage = function(role, text) {
  state.chatLog = state.chatLog || [];
  state.chatLog.push({ role: role, text: text, ts: Date.now() });
  if (state.chatLog.length > 60) state.chatLog = state.chatLog.slice(-60);
  render();
  schedulePersist();
};

window.askAssistant = function(text) {
  pushChatMessage("user", text);
  var reply = answerAssistantQuery(text);
  pushChatMessage("assistant", reply);
};

window.sendAssistantMessage = function() {
  var input = document.getElementById("assistant-input");
  if (!input) return;
  var text = (input.value || "").trim();
  if (!text) return;
  askAssistant(text);
};

function answerAssistantQuery(rawText) {
  var text = (rawText || "").trim();

  // 신규 기획전 자동 입력 트리거
  if (/기획전.*(자동|만들|생성|복사)|자동\s*입력|새\s*기획전/.test(text)) {
    setTimeout(function(){ openBulkWizard(); }, 50);
    return "🪄 신규 기획전 자동 입력 창을 열었어요. 원본 기획전 · 대상 채널 · 가격 조정률을 고르면 바로 만들어드릴게요.";
  }

  var rows = collectChannelStats();
  if (!rows.length) {
    return "아직 마진계산 탭에 입력된 판매가가 없어요. 입력하시면 채널별 마진율을 알려드릴 수 있어요.";
  }

  // 급락/이상치
  if (/급락|떨어|하락|이상치/.test(text)) {
    if (!state.marginSnapshot) return "아직 저장된 스냅샷이 없어요. 종합 대시보드의 '📌 현재 상태 스냅샷 저장'을 먼저 눌러주시면, 다음부터 마진이 3%p 이상 떨어졌을 때 알려드릴 수 있어요.";
    var snap = state.marginSnapshot.data;
    var drops = [];
    rows.forEach(function(r) {
      var key = r.navPlatId + "||" + (r.navSubId||"") + "||" + r.chanLabel;
      if (snap[key] !== undefined) {
        var delta = r.avg - snap[key];
        if (delta <= -0.03) drops.push({ r: r, delta: delta, prev: snap[key] });
      }
    });
    if (!drops.length) return "스냅샷(" + new Date(state.marginSnapshot.savedAt).toLocaleDateString('ko-KR') + ") 대비 3%p 이상 하락한 채널은 없어요 ✓";
    drops.sort(function(a,b){ return a.delta - b.delta; });
    return "📉 스냅샷 대비 마진이 하락한 채널:\n" + drops.slice(0, 5).map(function(d) {
      return "· " + d.r.label + " · " + d.r.chanLabel + ": " + pct1(d.prev) + " → " + pct1(d.r.avg) + " (" + pct1(d.delta) + ")";
    }).join("\n");
  }

  // 위험/낮은 마진 채널
  if (/(위험|낮은|최저|바닥).*(채널|마진)|(채널|마진).*(위험|낮은|최저)/.test(text)) {
    var sorted = rows.slice().sort(function(a,b){ return a.avg - b.avg; });
    return "📉 마진율이 가장 낮은 채널:\n" + sorted.slice(0, 3).map(function(r, i) {
      return (i+1) + ". " + r.label + " · " + r.chanLabel + " — " + pct1(r.avg) + " (" + r.count + "개 항목)";
    }).join("\n");
  }

  // 높은 마진 채널
  if (/(높은|최고|베스트).*(채널|마진)|(채널|마진).*(높은|최고)/.test(text)) {
    var sorted = rows.slice().sort(function(a,b){ return b.avg - a.avg; });
    return "📈 마진율이 가장 높은 채널:\n" + sorted.slice(0, 3).map(function(r, i) {
      return (i+1) + ". " + r.label + " · " + r.chanLabel + " — " + pct1(r.avg) + " (" + r.count + "개 항목)";
    }).join("\n");
  }

  // 평균
  if (/평균/.test(text)) {
    var overallAvg = rows.reduce(function(s,r){ return s+r.avg; }, 0) / rows.length;
    return "전체 평균 마진율은 " + pct1(overallAvg) + " 입니다 (" + rows.length + "개 채널 기준).";
  }

  // 요약/현황
  if (/요약|현황|리포트|전체.*보여/.test(text)) {
    var overallAvg = rows.reduce(function(s,r){ return s+r.avg; }, 0) / rows.length;
    var sorted = rows.slice().sort(function(a,b){ return b.avg - a.avg; });
    var best = sorted[0], worst = sorted[sorted.length-1];
    var riskCount = rows.filter(function(r){ return r.avg < 0.10; }).length;
    return "📊 전체 현황 요약\n" +
      "· 평균 마진율: " + pct1(overallAvg) + "\n" +
      "· 최고: " + best.label + " · " + best.chanLabel + " (" + pct1(best.avg) + ")\n" +
      "· 최저: " + worst.label + " · " + worst.chanLabel + " (" + pct1(worst.avg) + ")\n" +
      "· 위험 채널(10% 미만): " + riskCount + "개";
  }

  // 플랫폼명 매칭
  var allPlatLabels = [];
  state.platformDefs.forEach(function(p) {
    if (p.isOtherGroup) (p.subPlatforms||[]).forEach(function(s){ allPlatLabels.push(s.label); });
    else allPlatLabels.push(p.label);
  });
  var matched = allPlatLabels.find(function(lbl){ return text.indexOf(lbl) >= 0; });
  if (matched) {
    var chanRows = rows.filter(function(r){ return r.label.indexOf(matched) >= 0; });
    if (!chanRows.length) return matched + "에는 아직 입력된 데이터가 없어요.";
    var avg = chanRows.reduce(function(s,r){ return s+r.avg; }, 0) / chanRows.length;
    return "🏬 " + matched + " 평균 마진율: " + pct1(avg) + "\n" + chanRows.map(function(r) {
      return "· " + r.chanLabel + ": " + pct1(r.avg) + " (" + r.count + "개)";
    }).join("\n");
  }

  // 상품명 매칭
  var matchedProd = state.products.find(function(p){ return p.name && text.indexOf(p.name) >= 0; });
  if (matchedProd) {
    return "'" + matchedProd.name + "' 개당 원가는 " + won(matchedProd.unitCost) + "원이에요. 채널별 마진은 마진계산 탭에서 확인할 수 있어요.";
  }

  return "이렇게 물어보실 수 있어요:\n" +
    "· \"가장 낮은 마진 채널은?\"\n" +
    "· \"메가마트 마진율 알려줘\"\n" +
    "· \"전체 평균 마진율은?\"\n" +
    "· \"급락한 채널 있어?\"\n" +
    "· \"새 기획전 자동 입력해줘\"";
}

function renderAssistantWidget() {
  var log = state.chatLog || [];
  var riskCount = 0;
  try {
    riskCount = collectChannelStats().filter(function(r){ return r.avg < 0.10; }).length;
  } catch(e) {}

  var toggleBtn = '<button type="button" onclick="toggleAssistant()" ' +
    'title="' + (riskCount > 0 ? '마진율 10% 미만 위험 채널 ' + riskCount + '개' : '마진 어시스턴트') + '" ' +
    'style="position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;border:none;box-shadow:0 4px 16px rgba(0,0,0,0.25);cursor:pointer;font-size:22px;z-index:9998;display:flex;align-items:center;justify-content:center;">' +
    (state.assistantOpen ? '✕' : '💬') +
    (!state.assistantOpen && riskCount > 0 ? '<span title="마진율 10% 미만 위험 채널 ' + riskCount + '개" style="position:absolute;top:-2px;right:-2px;background:#9C3B27;color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;">' + riskCount + '</span>' : '') +
  '</button>';

  if (!state.assistantOpen) return toggleBtn;

  var msgsHtml = log.length ? log.map(function(m) {
    var isUser = m.role === "user";
    return '<div style="display:flex;justify-content:' + (isUser ? "flex-end" : "flex-start") + ';margin-bottom:8px;">' +
      '<div style="max-width:82%;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;white-space:pre-line;' +
        (isUser ? 'background:var(--ink);color:#fff;border-bottom-right-radius:2px;' : 'background:var(--paper);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:2px;') +
      '">' + esc(m.text) + '</div></div>';
  }).join("") : '<div style="font-size:12px;color:var(--muted);text-align:center;padding:24px 0;">궁금한 걸 물어보세요 👋<br><span style="font-size:11px;">마진 데이터 질의응답 · 기획전 자동입력을 도와드려요</span></div>';

  var quickChips = ['가장 낮은 마진 채널은?', '전체 평균 마진율은?', '급락한 채널 있어?', '새 기획전 자동 입력해줘'].map(function(q) {
    return '<button type="button" onclick="askAssistant(\'' + esc(q) + '\')" style="font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap;">' + esc(q) + '</button>';
  }).join("");

  return toggleBtn +
    '<div style="position:fixed;bottom:82px;right:20px;width:340px;max-width:calc(100vw - 32px);height:480px;max-height:calc(100vh - 120px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;z-index:9998;overflow:hidden;">' +
      '<div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--paper);flex-shrink:0;">' +
        '<div><div style="font-size:13px;font-weight:700;color:var(--ink);">🤖 마진 어시스턴트</div><div style="font-size:10px;color:var(--muted);">데이터 질의응답 · 자동입력 도우미</div></div>' +
        '<button type="button" onclick="toggleAssistant()" style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);">✕</button>' +
      '</div>' +
      '<div id="assistant-log" style="flex:1;overflow-y:auto;padding:12px 14px;">' + msgsHtml + '</div>' +
      '<div style="padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;">' + quickChips + '</div>' +
      '<div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-shrink:0;">' +
        '<input id="assistant-input" type="text" class="text-input" style="flex:1;min-width:0;" placeholder="마진에 대해 물어보세요..." onkeydown="if(event.key===\'Enter\'){sendAssistantMessage();}" />' +
        '<button type="button" class="add-form-confirm" style="padding:8px 14px;" onclick="sendAssistantMessage()">전송</button>' +
      '</div>' +
    '</div>';
}

function render() {
  var root = document.getElementById("root");
  var _scrollY = window.scrollY || window.pageYOffset || 0;
  if (!root) return;

  // ── 포커스 상태 스냅샷 (innerHTML 교체로 소실되므로 복원용) ──
  var _act = document.activeElement;
  var _focusId = (_act && _act.id) ? _act.id : null;
  var _selStart = null, _selEnd = null;
  if (_focusId && _act.setSelectionRange) {
    try { _selStart = _act.selectionStart; _selEnd = _act.selectionEnd; } catch (e) {}
  }

  var tab = state.activeTab;
  var header = renderHeader();
  var nav = renderNav();
  var content = "";
  if      (tab === "dashboard") content = renderDashboard();
  else if (tab === "compare")   content = renderCompareTab();

  else if (tab === "standard")  content = renderStandardPrice();
  else if (tab === "calc")      content = renderCalc();
  else if (tab === "fee")       content = renderFeeView();
  else if (tab === "shipping")  content = renderShippingCost();
  else if (tab === "packaging") content = renderPackagingCost();
  else if (tab === "cost")      content = renderCost();
  root.innerHTML = header + nav + '<main class="app-main">' + content + '</main>' +
    renderAssistantWidget() + renderBulkWizard();
  window.scrollTo(0, _scrollY);

  // ── 포커스 복원: 같은 id 요소가 살아있으면 커서 위치까지 되돌린다 ──
  if (_focusId) {
    var _re = document.getElementById(_focusId);
    if (_re && typeof _re.focus === "function") {
      try {
        _re.focus({ preventScroll: true });
        if (_selStart !== null && _re.setSelectionRange) _re.setSelectionRange(_selStart, _selEnd);
      } catch (e) {}
    }
  }
  
  // 드래그 정렬 초기화 (SortableJS)
  setTimeout(function() {
    initDragSort();
    // 숫자 입력란 자동 선택
    var inputs = document.querySelectorAll('input[type="number"]');
    inputs.forEach(function(input) {
      input.onfocus = function() { this.select(); };
    });
    // 어시스턴트 채팅 스크롤을 항상 최신 메시지로
    var chatLog = document.getElementById("assistant-log");
    if (chatLog) chatLog.scrollTop = chatLog.scrollHeight;
  }, 10);
}

window._appReady = function(user) {
  loadState(function(loaded) {
    if (loaded) {
      if (loaded.products)      state.products = loaded.products;
      if (loaded.platformDefs)  state.platformDefs = loaded.platformDefs;
      if (loaded.channelEntries) state.channelEntries = loaded.channelEntries;
      if (loaded.targetMargin !== undefined) state.targetMargin = loaded.targetMargin;
      if (loaded.salesRecords) state.salesRecords = loaded.salesRecords;
      // 과거 applyBulk 버그가 만든 중첩 쓰레기 키 정리 ("||" 없는 키는 잘못된 데이터)
      Object.keys(state.channelEntries).forEach(function(k) {
        if (k.indexOf("||") < 0) delete state.channelEntries[k];
      });
      if (loaded.standardPrices) state.standardPrices = loaded.standardPrices;
      if (loaded.categoryDefs)  state.categoryDefs = loaded.categoryDefs;
      if (loaded.calcDeletedIds) state.calcDeletedIds = loaded.calcDeletedIds;
      if (loaded.platHiddenMap)   state.platHiddenMap   = loaded.platHiddenMap;
      if (loaded.platformOrder)  state.platformOrder  = loaded.platformOrder;
      if (loaded.campaignOrder)  state.campaignOrder  = loaded.campaignOrder;
      if (loaded.shippingData)   state.shippingData   = loaded.shippingData;
      if (loaded.packagingData)  state.packagingData  = loaded.packagingData;
      if (loaded.activeFeeTab)    state.activeFeeTab    = loaded.activeFeeTab;
      if (loaded.standardHiddenChannels) state.standardHiddenChannels = loaded.standardHiddenChannels;
      if (loaded.marginSnapshot) state.marginSnapshot = loaded.marginSnapshot;
      if (loaded.chatLog) state.chatLog = loaded.chatLog;
      if (loaded.deletedDefaultPlatformIds) state.deletedDefaultPlatformIds = loaded.deletedDefaultPlatformIds;
      if (loaded.deletedDefaultChannelKeys) state.deletedDefaultChannelKeys = loaded.deletedDefaultChannelKeys;
    }
    
    // 누락된 채널 자동 복구: DEFAULT와 병합 (단, 사용자가 의도적으로 삭제한 것은 복구하지 않음)
    if (state.platformDefs && DEFAULT_PLATFORM_DEFS) {
      DEFAULT_PLATFORM_DEFS.forEach(function(defPlat) {
        if (state.deletedDefaultPlatformIds.indexOf(defPlat.id) >= 0) return; // 삭제된 플랫폼은 복구 안 함
        var curPlat = state.platformDefs.find(function(p){ return p.id === defPlat.id; });
        if (!curPlat) {
          // 플랫폼이 없으면 추가
          state.platformDefs.push(deepClone(defPlat));
        } else if (!defPlat.isOtherGroup && defPlat.channels) {
          // 누락된 채널 추가 (서브플랫폼이 아닌 경우만, 의도적으로 삭제한 채널은 제외)
          (defPlat.channels || []).forEach(function(defChan) {
            var dKey = defPlat.id + "||" + defChan.id;
            if (state.deletedDefaultChannelKeys.indexOf(dKey) >= 0) return;
            var curChan = (curPlat.channels || []).find(function(c){ return c.id === defChan.id; });
            if (!curChan) {
              if (!curPlat.channels) curPlat.channels = [];
              curPlat.channels.push(deepClone(defChan));
            }
          });
        }
      });
    }

    // ── feeType 확정 주입 (DEFAULT 병합 이후에 실행해야 신규 채널까지 커버) ──
    // 이 시점 이후로 isStandardChannel() 은 라벨을 전혀 보지 않는다.
    var _migrated = migrateFeeTypes();

    // 저장된 탭 순서 재적용 (platformOrder / campaignOrder)
    (function applySavedOrders() {
      if (state.platformOrder && state.platformOrder.length) {
        var po = state.platformOrder;
        state.platformDefs.sort(function(a, b) {
          var ia = po.indexOf(a.id), ib = po.indexOf(b.id);
          if (ia < 0) ia = 9999;
          if (ib < 0) ib = 9999;
          return ia - ib;
        });
      }
      Object.keys(state.campaignOrder || {}).forEach(function(key) {
        var parts = key.split("||");
        if (parts.length !== 2) return;
        var pid = parts[0], cid = parts[1];
        var chans = _getTargetChannelsById(pid);
        var chan = (chans || []).find(function(c){ return c.id === cid; });
        if (!chan || !chan.campaigns) return;
        var co = state.campaignOrder[key];
        chan.campaigns.sort(function(a, b) {
          var ia = co.indexOf(a.id), ib = co.indexOf(b.id);
          if (ia < 0) ia = 9999;
          if (ib < 0) ib = 9999;
          return ia - ib;
        });
      });
    })();

    // ※ 구 migrateFeeType() IIFE 제거됨.
    //   그 코드는 feeType 이 없을 때 isStandardChannel(chan) 을 호출했는데,
    //   isStandardChannel 이 feeType 만 보도록 정정된 지금은 항상 false 를 반환해
    //   모든 채널이 "campaign" 으로 확정되는 순환 버그가 된다.
    //   대체 구현은 위쪽의 migrateFeeTypes() (DEFAULT 병합 직후 호출) 이다.

    render();
    setSaveLabel("saved");
    // 마이그레이션이 실제로 일어났다면 확정값을 즉시 영구 저장 (다음 로드부터는 추측 0회)
    if (_migrated > 0) schedulePersist();
  });
};

if (window._firebaseUser) {
  window._appReady(window._firebaseUser);
}
</script>
