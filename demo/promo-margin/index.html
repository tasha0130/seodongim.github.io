<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>데일리홈 마진 대시보드</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon-180.png">

<script type="module">
/* ============================================================
   Firebase 초기화 + Google 로그인 + Firestore 저장
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  storageBucket: "your-project.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const ALLOWED_DOMAIN = "example.com";
const ALLOWED_EMAILS = ["admin@example.com", "manager@example.com"];
const DOC_PATH = "dashboards/margin_b2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

// 로그인 화면 렌더
function renderLoginScreen(errorMsg) {
  document.getElementById("root").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F3EC;">' +
    '<div style="background:#fff;border:1px solid #E2DCC9;border-radius:16px;padding:40px 48px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);">' +
    '<div style="font-size:22px;font-weight:700;color:#1C2541;margin-bottom:4px;">데일리홈</div>' +
    '<div style="font-size:11px;color:#8B8275;letter-spacing:0.12em;margin-bottom:28px;">MARGIN CONTROL ROOM</div>' +
    '<div style="font-size:13px;color:#4A5476;margin-bottom:24px;">승인된 구성원만 접근할 수 있습니다.<br>데일리홈 구글 계정으로 로그인해주세요.</div>' +
    (errorMsg ? '<div style="font-size:12px;color:#9C3B27;background:#FBE6E0;border:1px solid #F2C0B0;border-radius:8px;padding:10px 14px;margin-bottom:16px;">' + errorMsg + '</div>' : '') +
    '<button id="google-login-btn" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 20px;background:#fff;border:1px solid #E2DCC9;border-radius:10px;font-size:14px;font-weight:600;color:#1C2541;cursor:pointer;font-family:inherit;transition:border-color 0.2s;">' +
    '<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>' +
    'Google 계정으로 로그인</button>' +
    '<div style="font-size:11px;color:#8B8275;margin-top:20px;">@example.com 계정만 접근 가능합니다</div>' +
    '</div></div>';

  document.getElementById("google-login-btn").addEventListener("click", function() {
    signInWithPopup(auth, provider)
      .then(function(result) {
        const email = result.user.email || "";
        const domain = email.split("@")[1] || "";
        if (domain !== ALLOWED_DOMAIN && !ALLOWED_EMAILS.includes(email)) {
          signOut(auth);
          renderLoginScreen("접근 권한이 없는 계정입니다.<br>데일리홈 회사 계정(@example.com)으로 로그인해주세요.");
        }
      })
      .catch(function(err) {
        renderLoginScreen("로그인 중 오류가 발생했습니다: " + err.message);
      });
  });
}

// Firestore 저장
window.firebaseSave = async function(key, payload) {
  try {
    await setDoc(doc(db, DOC_PATH.split("/")[0], DOC_PATH.split("/")[1]), { [key]: payload, updatedAt: Date.now() }, { merge: true });
    return true;
  } catch(e) { return false; }
};

// Firestore 불러오기
window.firebaseLoad = async function(key) {
  try {
    const snap = await getDoc(doc(db, DOC_PATH.split("/")[0], DOC_PATH.split("/")[1]));
    if (snap.exists()) {
      const data = snap.data();
      return data[key] || null;
    }
    return null;
  } catch(e) { return null; }
};

// 로그아웃
window.firebaseSignOut = function() {
  signOut(auth).catch(function(){});
};

// 현재 유저
window.getCurrentUser = function() {
  return auth.currentUser;
};

// ── 포트폴리오 공개 데모 모드 ──
// 원본은 회사 구글 계정(도메인 검증)으로 로그인해야 진입하는 구조이나,
// 공개 데모에서는 인증 단계를 제거하고 앱을 바로 실행한다.
(function startDemo() {
  var demoUser = { email: "demo@example.com", displayName: "데모 사용자" };
  window._firebaseUser = demoUser;
  var checkReady = function() {
    if (typeof window._appReady === "function") {
      window._appReady(demoUser);
    } else {
      setTimeout(checkReady, 50);
    }
  };
  checkReady();
})();
</script>

<style>



* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }

:root {
  --ink: #1C2541;
  --ink-soft: #4A5476;
  --paper: #F6F3EC;
  --panel: #FFFFFF;
  --line: #E2DCC9;
  --muted: #8B8275;
  --brass: #B98B3E;
  --brass-deep: #8C6526;
  --sage: #2F6B45;
  --sage-bg: #E3F1E6;
  --amber: #8B6000;
  --amber-bg: #FBF0D9;
  --rust: #9C3B27;
  --rust-bg: #FBE6E0;
  --gold-bg: #FFF8E9;
  --gold-fc: #8B6000;
  --orange-bg: #FFF1E6;
  --orange-fc: #B5651D;
}

body {
  font-family: 'Pretendard', sans-serif;
  font-weight: 500;
  background: var(--paper);

  min-height: 100vh;
}

.serif { font-family: 'Pretendard', sans-serif; font-weight: 700; }
.mono { font-family: 'Pretendard', sans-serif; font-weight: 500; font-variant-numeric: tabular-nums; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 14px; }
.save-indicator { font-size: 12px; color: var(--muted); white-space: nowrap; }
.spinner {
  display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line);
  border-top-color: var(--brass); border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 4px;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.reset-btn {
  display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft);
  background: var(--paper); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 11px; cursor: pointer; font-family: inherit;
}
.reset-btn:hover { background: #fff; border-color: var(--brass); color: var(--brass-deep); }

.download-btn {
  font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--panel);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer;
  font-family: inherit; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.download-btn:hover { border-color: var(--brass); color: var(--brass-deep); background: var(--gold-bg); }

.main-nav {
  display: flex; gap: 4px; padding: 0 18px; background: var(--panel);
  border-bottom: 1px solid var(--line); overflow-x: auto;
  scrollbar-width: thin;
}
/* 탭이 많아 가로 스크롤이 생길 때 잘림을 부드럽게 */
.main-nav::-webkit-scrollbar { height: 5px; }
.main-nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
.nav-btn { flex-shrink: 0; }
.nav-btn {
  display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--muted); background: transparent; border: none; border-bottom: 3px solid transparent;
  padding: 12px 16px; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.nav-btn:hover { color: var(--ink-soft); }
.nav-btn-active { color: var(--brass-deep); border-bottom-color: var(--brass); }

.app-main { max-width: 1220px; margin: 0 auto; padding: 16px 10px 60px; }
.app-footer { text-align: center; font-size: 11px; color: var(--muted); padding: 16px 0 28px; }

.platform-tabrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.platform-tab {
  flex-shrink: 0; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.platform-tab:hover { border-color: var(--brass); color: var(--brass-deep); }
.platform-tab-active { background: var(--ink); color: #fff; border-color: var(--ink); }
.platform-tabrow-sub { margin-top: -8px; margin-bottom: 16px; padding-left: 6px; border-left: 2px solid var(--line); }
.platform-tab-sub { font-size: 12px; padding: 6px 13px; }
.sub-platform-label { font-size: 11px; color: var(--muted); margin: -4px 0 6px 8px; }

.platform-panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.platform-panel-title { font-size: 19px; font-weight: 700; color: var(--ink); }
.platform-panel-sub { font-size: 12px; color: var(--muted); }
.platform-panel-fee { font-size: 13px; color: var(--brass-deep); font-weight: 600; }
.panel-head-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.view-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }

.legend-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.legend-item { font-size: 12px; color: var(--muted); }
.legend-good { color: var(--sage); }
.legend-warn { color: var(--amber); }
.legend-risk { color: var(--rust); }

.badge {
  display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
}
.badge-good { background: var(--sage-bg); color: var(--sage); }
.badge-warn { background: var(--amber-bg); color: var(--amber); }
.badge-risk { background: var(--rust-bg); color: var(--rust); }

.dash-stack { display: flex; flex-direction: column; gap: 28px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 880px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .kpi-grid { grid-template-columns: 1fr; } }
.kpi-card {
  background: var(--panel); border: 1px solid var(--line); border-top: 4px solid;
  border-radius: 12px; padding: 16px;
}
.kpi-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; }
.kpi-name { font-size: 13px; color: var(--ink); font-weight: 700; margin: 0 0 12px; }
.kpi-number { font-size: 28px; font-weight: 600; color: var(--ink); }
.kpi-bar-track { height: 5px; background: var(--paper); border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
.kpi-bar-fill { height: 100%; border-radius: 99px; }
.kpi-sub { font-size: 11px; color: var(--muted); }
.kpi-empty { font-size: 12px; color: var(--muted); padding: 18px 0 6px; }

.empty-state {
  background: var(--gold-bg); color: var(--gold-fc);
  border: 1px solid #EDDCAE; border-radius: 10px; padding: 14px 16px; font-size: 13px;
}

.cat-block { display: flex; flex-direction: column; gap: 10px; }
.cat-block-header { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
.cat-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }

.cat-row { display: grid; grid-template-columns: minmax(170px, 1.4fr) repeat(var(--camp-count, 4), 1fr); border-bottom: 1px solid var(--line); }
.cat-row:last-child { border-bottom: none; }
.cat-row-head { background: var(--paper); }
.cat-cell { padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; }
.cat-cell-name { border-right: 1px solid var(--line); flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }
.cat-cell-pname { font-size: 13px; font-weight: 700; }
.cat-cell-psize { font-size: 12px; font-weight: 500; color: var(--ink-soft); background: var(--panel); border: 1px solid var(--line); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.cat-cell-camphead { font-size: 12px; font-weight: 700; text-align: center; align-items: center; }
.cat-cell-empty { color: var(--muted); font-size: 12px; text-align: center; align-items: center; }
.cat-cell-data { gap: 4px; }
.cat-metric { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
.cat-metric-label { color: var(--muted); }
.cat-metric-value { font-size: 12px; color: var(--ink); }

.camp-tabrow { display: flex; gap: 6px; padding: 0 2px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
.camp-tab {
  display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-bottom: none;
  border-radius: 10px 10px 0 0; padding: 9px 16px; cursor: pointer; font-family: inherit;
  position: relative; top: 1px; white-space: nowrap; flex-shrink: 0;
}
.camp-tab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.camp-tab-empty { font-size: 10px; color: var(--muted); background: var(--line); padding: 1px 6px; border-radius: 99px; }
.camp-tab-active {
  background: var(--panel); color: var(--tab-color); border-color: var(--line);
  box-shadow: 0 -2px 6px rgba(0,0,0,0.03); font-weight: 700;

.cat-section { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

  background: var(--paper); border: none; padding: 11px 14px; cursor: pointer; font-family: inherit; color: var(--ink);

.cat-count { font-size: 11px; color: var(--muted); font-weight: 400; }
.cat-section-chev { margin-left: auto; color: var(--muted); }

.prow-grid {
  display: grid;
  grid-template-columns: minmax(190px,1.6fr) minmax(115px,1fr) minmax(100px,0.9fr) minmax(100px,0.9fr) minmax(110px,1fr) minmax(90px,0.9fr) 56px;

.cat-section-thead { padding: 9px 14px; background: #FAF8F2; border-bottom: 1px solid var(--line); }
@media (max-width: 600px) { .cat-section-thead { display: none; } }
.thead-cell { font-size: 11px; font-weight: 700; color: var(--muted); }
.thead-gold { color: var(--gold-fc); }
.thead-orange { color: var(--orange-fc); }

.prow { border-bottom: 1px solid var(--line); }

.prow-main { padding: 10px 10px; }
.prow-name { display: flex; flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }

.prow-na { color: var(--muted); font-size: 12px; }

.input-suffix span { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.input-suffix-gold { background: var(--gold-bg); border-color: #EDDCAE; }

.input-suffix-orange { background: var(--orange-bg); border-color: #F2CBA8; }
.input-suffix-orange span { color: var(--orange-fc); }
.num-input {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); background: transparent;
  border: none; padding: 7px 0; width: 100%; min-width: 0;
}
.num-input:focus { outline: none; }
.num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.prow-detail {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 14px;
  background: #FAF8F2; padding: 12px 14px 14px; border-top: 1px dashed var(--line); font-size: 12px;
}
.detail-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; min-width: 0; flex-wrap: wrap; }
.detail-item > span:first-child { flex-shrink: 0; max-width: 65%; white-space: normal; line-height: 1.4; }
.detail-item > span.mono { text-align: right; flex-shrink: 0; }
@media (max-width: 600px) { .prow-detail { grid-template-columns: 1fr; padding: 10px 10px 12px; } }
.detail-item { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-soft); align-items: center; }
.detail-gold { color: var(--gold-fc); }
.detail-orange { color: var(--orange-fc); }

// 채널이 "상시판매가" 채널인지 판별 (명시적 feeType 우선)
// feeType 미지정 구버전 데이터는 라벨에 "상시"가 포함되어 있는지로 추정한다.
// (예전에 "id가 general이면 무조건 상시"로 판별하던 방식이 근본 버그였음 — general은
// 거의 모든 플랫폼의 기본 기획전 채널에 동일하게 붙는 id라서, 실제로는 기획전인 채널까지
// 전부 상시판매가로 잘못 분류되고 있었음. 이제는 라벨 텍스트(혹은 명시적 feeType)로만 판별한다.)
function isStandardChannel(chan) {
  if (!chan) return false;
  // feeType 이 유일한 진실. 라벨 텍스트 추측은 하지 않는다.
  // (구버전 데이터는 loadState 직후 migrateFeeTypes() 가 1회 확정 주입한다.)
  return chan.feeType === "standard";
}

/* ── 구버전 데이터 마이그레이션 ────────────────────────────────
   feeType 이 없는 채널에만 1회 주입한다. 이미 값이 있으면 절대 건드리지 않는다.
   추측은 여기서 단 한 번만 일어나고, 이후 런타임 판별은 순수 feeType 기반이 된다.
   → 사용자가 "상시할인 기획전" / "비상시 특가전" 처럼 지어도 오분류되지 않음.
   ─────────────────────────────────────────────────────────── */
function migrateFeeTypes() {
  var touched = 0;
  function fix(chanList) {
    if (!Array.isArray(chanList)) return;
    chanList.forEach(function (c) {
      if (!c) return;
      if (c.feeType === "standard" || c.feeType === "campaign") return; // 확정값 보존
      var label = String(c.label || "");
      // 구버전 추정 규칙 (우선순위 순, 이 추정은 데이터당 딱 1회만 일어난다)
      //  1) "기획전"/"특가"/"딜" 이 들어가면 무조건 campaign
      //     → "상시할인 기획전" 같은 함정 라벨이 standard 로 새는 것을 막는다.
      //  2) 그 외에 "상시판매" 를 포함하거나 라벨이 "상시" 로 시작하면 standard
      //  3) 나머지는 campaign (상시로 오분류되면 수수료가 통째로 틀어지므로 더 안전)
      var isStd;
      if (/기획전|특가|딜|프로모션|이벤트/.test(label)) {
        isStd = false;
      } else {
        isStd = label.indexOf("상시판매") >= 0 || /^상시/.test(label);
      }
      c.feeType = isStd ? "standard" : "campaign";
      touched++;
    });
  }
  (state.platformDefs || []).forEach(function (p) {
    fix(p.channels);
    (p.subPlatforms || []).forEach(function (sp) { fix(sp.channels); });
  });
  if (touched) console.info("[migrate] feeType 확정 주입:", touched, "개 채널");
  return touched;
}

function getActivePlatformDef() {
  return state.platformDefs.find(function(p){ return p.id === state.activePlatformId; }) || state.platformDefs[0];
}

function isOtherGroup() {
  return getActivePlatformDef().isOtherGroup;
}

// 현재 실제 작업 플랫폼 (기타그룹이면 서브플랫폼)
function getWorkingPlatId() {
  var plat = getActivePlatformDef();
  if (plat.isOtherGroup) return state.activeSubPlatId;
  return plat.id;
}

// 현재 작업 플랫폼의 채널 목록
function getWorkingChannels() {
  var plat = getActivePlatformDef();
  if (plat.isOtherGroup) {
    var sub = (plat.subPlatforms || []).find(function(s){ return s.id === state.activeSubPlatId; });
    return sub ? sub.channels : [];
  }
  return plat.channels || [];
}

function getActiveChannel() {
  var chans = getWorkingChannels();
  return chans.find(function(c){ return c.id === state.activeChannelId; }) || chans[0] || null;
}

function getActiveCampaign() {
  var chan = getActiveChannel();
  if (!chan) return null;
  return (chan.campaigns || []).find(function(c){ return c.id === state.activeCampaignId; }) || (chan.campaigns || [])[0] || null;
}

  var newId = "ch_" + Date.now();

  var newChan = standardMode

function addChannel(platId) {

  var targetChannels;
  if (plat && plat.isOtherGroup) {
    var sub = (plat.subPlatforms || []).find(function(s){ return s.id === state.activeSubPlatId; });

// 기본(DEFAULT_PLATFORM_DEFS) 채널인지 확인
function _isDefaultChannel(platId, chanId) {
  var defPlat = DEFAULT_PLATFORM_DEFS.find(function(p){ return p.id === platId; });
  if (defPlat) return !!(defPlat.channels || []).find(function(c){ return c.id === chanId; });
  var otherGroup = DEFAULT_PLATFORM_DEFS.find(function(p){ return p.isOtherGroup; });
  if (otherGroup) {
    var defSub = (otherGroup.subPlatforms || []).find(function(s){ return s.id === platId; });
    if (defSub) return !!(defSub.channels || []).find(function(c){ return c.id === chanId; });
  }
  return false;
}

function deleteChannel(platId, chanId) {
  var targetChannels = _getTargetChannels(platId);
  if (!targetChannels || targetChannels.length <= 1) { alert("최소 1개의 채널이 필요합니다."); return; }
  var chan = targetChannels.find(function(c){ return c.id === chanId; });
  if (!window.confirm('"' + (chan ? chan.label : chanId) + '" 채널을 삭제할까요? 입력된 마진 데이터도 함께 삭제됩니다.')) return;
  var tgt = targetChannels;
  tgt.splice(tgt.findIndex(function(c){ return c.id === chanId; }), 1);
  // channelEntries 등은 기타플랫폼의 경우 서브플랫폼 id를 키로 사용하므로, 정리 시에도 동일한 id로 변환
  var plat = state.platformDefs.find(function(p){ return p.id === platId; });
  var effectivePlatId = (plat && plat.isOtherGroup) ? state.activeSubPlatId : platId;
  _cleanupChannelData(effectivePlatId, chanId);
  if (_isDefaultChannel(platId, chanId)) {
    var dKey = platId + "||" + chanId;
    if (state.deletedDefaultChannelKeys.indexOf(dKey) < 0) state.deletedDefaultChannelKeys.push(dKey);
  }
  if (state.activeChannelId === chanId) {
    state.activeChannelId = tgt[0].id;
    state.activeCampaignId = ((tgt[0].campaigns || [])[0] || {}).id || "A";
  }
  schedulePersist(); render();
}

// platId(주요/서브 모두)로 채널 배열을 직접 조회 — activeSubPlatId에 의존하지 않음
function _getTargetChannelsById(platId) {
  for (var i = 0; i < state.platformDefs.length; i++) {
    var p = state.platformDefs[i];
    if (p.isOtherGroup) {
      var subs = p.subPlatforms || [];
      for (var j = 0; j < subs.length; j++) {
        if (subs[j].id === platId) return subs[j].channels || [];
      }
    } else if (p.id === platId) {
      return p.channels || [];
    }
  }
  return [];
}

function _getTargetChannels(platId) {
  var plat = state.platformDefs.find(function(p){ return p.id === platId; });
  if (plat) {
    if (plat.isOtherGroup) {
      var sub = (plat.subPlatforms || []).find(function(s){ return s.id === state.activeSubPlatId; });
      return sub ? sub.channels : [];
    }
    return plat.channels || [];
  }
  // 기타플랫폼의 서브플랫폼 id로 직접 조회 (수수료설정 화면처럼 활성 탭과 무관하게 동작해야 하는 곳에서 사용)
  var otherGroup = state.platformDefs.find(function(p){ return p.isOtherGroup; });
  if (otherGroup) {
    var subDirect = (otherGroup.subPlatforms || []).find(function(s){ return s.id === platId; });
    if (subDirect) return subDirect.channels || [];
  }
  return [];
}

// 전체 채널 평탄화 (플랫폼/기타플랫폼 서브 포함) — AI 어시스턴트 · 자동입력 위저드에서 사용
function flattenAllChannels() {
  var out = [];
  state.platformDefs.forEach(function(p) {
    if (p.isOtherGroup) {
      (p.subPlatforms || []).forEach(function(sub) {
        (sub.channels || []).forEach(function(chan) {

}

function _cleanupPlatformData(platId) {

  Object.keys(state.standardPrices).forEach(function(k){ if (k.indexOf(prefix) === 0) delete state.standardPrices[k]; });
  Object.keys(state.platHiddenMap || {}).forEach(function(k){ if (k.indexOf(prefix) === 0) delete state.platHiddenMap[k]; });
  Object.keys(state.campaignOrder || {}).forEach(function(k){ if (k.indexOf(prefix) === 0) delete state.campaignOrder[k]; });
  if (state.standardHiddenChannels) delete state.standardHiddenChannels[platId];
}
function _cleanupChannelData(platId, chanId) {
  var key1 = platId + "||" + chanId;
  Object.keys(state.channelEntries).forEach(function(k){ if (k.indexOf(key1 + "||") === 0) delete state.channelEntries[k]; });
  delete state.standardPrices[key1];
  delete (state.platHiddenMap || {})[key1];
  delete (state.campaignOrder || {})[key1];
}

// 엔트리 업데이트
function updateEntry(platId, chanId, campId, prodId, field, value) {
  var key = platId + "||" + chanId + "||" + campId;
  if (!state.channelEntries[key]) state.channelEntries[key] = {};
  var prev = state.channelEntries[key][prodId] || {};
  var next = Object.assign({}, prev);
  next[field] = value;
  state.channelEntries[key][prodId] = next;
  schedulePersist();
  // 타입 토글(정률↔정액)은 셀 레이아웃이 바뀌므로 전체 재렌더
  if (field === "sellerType" || field === "platType") {
    render();
  } else {
    patchEntryRow(platId, chanId, campId, prodId);
  }
}

function patchEntryRow(platId, chanId, campId, prodId, isStandard) {
  // ── 진입 가드 ──
  // "상시판매가"(e-std-*) 와 "마진계산"(e-*) 은 접두사가 달라 서로의 DOM 을 건드릴 수 없어야 한다.
  // 탭 컨텍스트와 isStandard 플래그가 어긋나면 잘못된 행을 갱신하게 되므로 조기 반환한다.
  var _tab = state.activeTab;
  if (isStandard && _tab !== "standard") return;
  if (!isStandard && _tab !== "calc" && _tab !== "dashboard") return;

  // 모든 플랫폼(서브플랫폼 포함)에서 채널 검색
  var chan = null;
  for (var _pi = 0; _pi < state.platformDefs.length; _pi++) {
    var _plat = state.platformDefs[_pi];
    var _chans = [];
    if (_plat.isOtherGroup) {
      var _subs = _plat.subPlatforms || [];
      for (var _si = 0; _si < _subs.length; _si++) {
        if (_subs[_si].id === platId) { _chans = _subs[_si].channels || []; break; }
      }
    } else if (_plat.id === platId) {
      _chans = _plat.channels || [];
    }
    if (_chans.length) {
      chan = _chans.find(function(c){ return c.id === chanId; });
      if (chan) break;
    }
  }
  if (!chan) return;
  var product = state.products.find(function(p){ return p.id === prodId; });
  if (!product) return;
  var entry = isStandard
    ? ((state.standardPrices[platId + "||" + chanId] || {})[prodId] || {})
    : getEntry(platId, chanId, campId, prodId);
  var feeRate = chan.feeRate || 0.10;
  var isBaby = !!chan.isBaby;
  var isSupply = chan.calcMode === "supply";

  if (isSupply) {
    var sm = calcSupplyMetrics(product, {
      supply: entry.supply, retail: entry.retail, coupon: entry.coupon,
      couponType: entry.couponType, supplyFee: entry.supplyFee, eventDisc: entry.eventDisc
    }, chan.feeRate || 0);
    var sHas = sm.supply > 0;
    var sIdBase = isStandard
      ? ("e-std-" + platId + "-" + chanId + "-" + prodId)
      : ("e-" + platId + "-" + chanId + "-" + campId + "-" + prodId);
    var sEnd = document.getElementById("end-" + sIdBase);
    if (sEnd) sEnd.innerHTML = sHas ? '<span class="mono">' + won(sm.supply) + "원</span>" : '<span class="prow-na">—</span>';
    var sBadge = document.getElementById("badge-" + sIdBase);
    if (sBadge) sBadge.innerHTML = sHas ? badgeHTML(sm.marginRate) : '<span class="prow-na">—</span>';
    [["supplyPerUnit", sm.supplyPerUnit], ["vat", sm.vat], ["couponAmt", sm.couponAmt],
     ["feeAmt", sm.feeAmt], ["margin", sm.margin]].forEach(function(pair) {
      var el = document.getElementById("dv-" + pair[0] + "-" + sIdBase);
      if (el) el.textContent = won(pair[1]) + "원";
    });
    return;
  }

  var m = isBaby
    ? calcBabyVoucherMetrics(product, { price: entry.price, seller: entry.seller, sellerCap: entry.sellerCap,
        sellerType: entry.sellerType, plat: entry.plat, platCap: entry.platCap, platShare: entry.platShare, platType: entry.platType }, feeRate, !!chan.babyWithCoupon)
    : calcMetrics(product, { price: entry.price, seller: entry.seller, sellerCap: entry.sellerCap,
                             sellerType: entry.sellerType, plat: entry.plat, platCap: entry.platCap, platShare: entry.platShare, platType: entry.platType }, feeRate);
  var hasPrice = m.price > 0;
  var idBase = isStandard
    ? ("e-std-" + platId + "-" + chanId + "-" + prodId)
    : ("e-" + platId + "-" + chanId + "-" + campId + "-" + prodId);

  // 엔딩가
  var endEl = document.getElementById("end-" + idBase);
  if (endEl) endEl.innerHTML = hasPrice ? '<span class="mono">' + won(m.ending) + "원</span>" : '<span class="prow-na">—</span>';

  // 마진율 뱃지
  var badgeEl = document.getElementById("badge-" + idBase);
  if (badgeEl) badgeEl.innerHTML = hasPrice ? badgeHTML(m.marginRate) : '<span class="prow-na">—</span>';

  // 상세 계산값
  var fields = isBaby
    ? { "vat": m.vat, "feeAmt": m.feeAmt, "sellerAmt": m.sellerAmt, "platAmt": m.voucherDiscount, "margin": m.margin }
    : { "vat": m.vat, "feeAmt": m.feeAmt, "sellerAmt": m.sellerAmt, "platAmt": m.platAmt, "margin": m.margin };
  // 제휴바우처의 플랫폼 쿠폰 별도 패치
  if (isBaby) {
    var bPlatEl = document.getElementById("dv-platExtra-" + idBase);
    if (bPlatEl) bPlatEl.textContent = (m.platShare > 0 ? won(m.platSellerAmt||0) + "원 반영 / " + won(m.platPlatAmt||0) + "원 미반영" : won(m.platAmt||0) + "원");
  }
  Object.keys(fields).forEach(function(k) {
    var el = document.getElementById("dv-" + k + "-" + idBase);
    if (el) el.textContent = won(fields[k]) + "원";
  });

  // 제휴바우처 쿠폰 셀 업데이트
  if (isBaby) {
    var voucherEl = document.getElementById("voucher-cell-" + idBase);
    if (voucherEl) {
      var withCoupon = !!chan.babyWithCoupon;
      var vText, vColor, vBg;
      if (!withCoupon) { vText = "미적용"; vColor = "#8B8275"; vBg = "#F6F3EC"; }
      else if (!m.price) { vText = "판매가 입력 필요"; vColor = "#8B8275"; vBg = "#F6F3EC"; }
      else if (m.price < 10000) { vText = "⚠ 최소 1만원 미달"; vColor = "#9C3B27"; vBg = "#FBE6E0"; }
      else { vText = "- " + won(m.voucherDiscount||0) + "원"; vColor = "#B5651D"; vBg = "#FFF1E6"; }
      voucherEl.style.background = vBg;
      voucherEl.innerHTML = '<span style="font-size:11px;font-weight:600;color:' + vColor + ';text-align:center;white-space:nowrap;">' + vText + '</span>' +
        (withCoupon && m.price >= 10000 ? '<span style="font-size:10px;color:#8B8275;text-align:center;">50% · 최대5천원</span>' : '');
    }
  }
}

// applyBulk
function applyBulk() {
  var val = Number(state.bulkValue);
  if (isNaN(val)) { alert("숫자를 입력해주세요."); return; }
  var field = state.bulkField, target = state.bulkTarget;
  if (state.bulkMode === "cost") {
    state.products.forEach(function(p) { if (target === "all" || p.category === target) p[field] = val; });
  } else if (state.bulkMode === "calc") {
    var platId = getWorkingPlatId();
    var chanId = state.activeChannelId;
    var campId = state.activeCampaignId;
    var key = platId + "||" + chanId + "||" + campId;
    if (!state.channelEntries[key]) state.channelEntries[key] = {};
    state.products.filter(function(p){ return !p.hidden && state.calcDeletedIds.indexOf(p.id) < 0 && (target === "all" || p.category === target); }).forEach(function(p) {
      var prev = state.channelEntries[key][p.id] || {};
      var ne = Object.assign({}, prev);
      ne[field] = val;
      state.channelEntries[key][p.id] = ne;
    });
  } else if (state.bulkMode === "standard") {
    var sPlatId = getWorkingPlatId();
    var sChanId = state.activeChannelId;
    var sKey = sPlatId + "||" + sChanId;
    if (!state.standardPrices[sKey]) state.standardPrices[sKey] = {};
    state.products.filter(function(p){ return !p.hidden && state.calcDeletedIds.indexOf(p.id) < 0 && (target === "all" || p.category === target); }).forEach(function(p) {
      var prev = state.standardPrices[sKey][p.id] || {};
      var ne = Object.assign({}, prev);
      ne[field] = val;
      state.standardPrices[sKey][p.id] = ne;
    });
  }
  schedulePersist(); state.bulkMode = null; render();
}

function copyCampaignData() {
  var platId = getWorkingPlatId();
  var chanId = state.activeChannelId;
  var isStd = state.activeTab === "standard";
  var key = isStd ? (platId + "||" + chanId) : (platId + "||" + chanId + "||" + state.activeCampaignId);
  var src = isStd ? state.standardPrices[key] : state.channelEntries[key];
  if (!src || Object.keys(src).length === 0) { alert("복사할 입력 데이터가 없습니다."); return; }
  state._copiedEntries = deepClone(src);
  var chan = getActiveChannel();
  state._copiedLabel = platId + " / " + (chan ? chan.label : chanId) + (isStd ? " (상시)" : " / " + state.activeCampaignId);
  render();
}

function pasteCampaignData() {
  if (!state._copiedEntries) { alert("먼저 복사할 기획전에서 📋 복사를 눌러주세요."); return; }
  var platId = getWorkingPlatId();
  var chanId = state.activeChannelId;
  var isStd = state.activeTab === "standard";
  var key = isStd ? (platId + "||" + chanId) : (platId + "||" + chanId + "||" + state.activeCampaignId);
  if (!window.confirm("[" + state._copiedLabel + "] 의 입력값을 현재 화면에 붙여넣을까요?\n기존 입력값은 덮어써집니다.")) return;
  if (isStd) state.standardPrices[key] = deepClone(state._copiedEntries);
  else state.channelEntries[key] = deepClone(state._copiedEntries);
  schedulePersist();
  render();
}

function renderCopyPasteBar() {
  var pasteBtn = state._copiedEntries
    ? '<button type="button" class="bulk-apply-btn" style="background:#2F6B45;" onclick="pasteCampaignData()">📥 붙여넣기 (' + esc(state._copiedLabel) + ')</button>'

  return '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">' +
    '<button type="button" class="bulk-apply-btn" style="background:#3F5E78;" onclick="copyCampaignData()">📋 현재 입력값 복사</button>' +
    pasteBtn +

window.openBulkWizard = function(prefill) {
  var chans = flattenAllChannels();
  var withData = chans.filter(function(c) { return (c.campaigns||[]).some(function(camp){
    var key = c.platId + "||" + c.chanId + "||" + camp.id;
    return state.channelEntries[key] && Object.keys(state.channelEntries[key]).length > 0;
  }); });
  var src = withData[0];
  var srcCamp = src ? (src.campaigns||[]).find(function(camp){
    var key = src.platId + "||" + src.chanId + "||" + camp.id;
    return state.channelEntries[key] && Object.keys(state.channelEntries[key]).length > 0;
  }) : null;
  state.bulkWizard = Object.assign({
    srcPlatId: src ? src.platId : "",
    srcChanId: src ? src.chanId : "",
    srcCampId: srcCamp ? srcCamp.id : "",
    targetPlatId: src ? src.platId : "",
    targetChanId: src ? src.chanId : "",
    targetMode: "new",   // "new" 새 기획전 생성 / 기존 캠페인 id 선택도 가능
    targetLabel: "",
    adjustType: "pct",   // "pct" 정률 / "fixed" 정액
    adjustValue: 0,
  }, prefill || {});
  state.assistantOpen = true;
  render();
};
window.closeBulkWizard = function() {
  state.bulkWizard = null;
  render();
};
window.updateBulkWizard = function(field, value) {
  if (!state.bulkWizard) return;
  state.bulkWizard[field] = value;
  // 플랫폼이 바뀌면 채널/기획전 선택을 그 플랫폼의 첫 값으로 리셋
  if (field === "srcPlatId") {
    var chans = flattenAllChannels().filter(function(c){ return c.platId === value; });
    state.bulkWizard.srcChanId = chans.length ? chans[0].chanId : "";
    state.bulkWizard.srcCampId = chans.length && chans[0].campaigns.length ? chans[0].campaigns[0].id : "";
  }
  if (field === "srcChanId") {
    var chans = flattenAllChannels().filter(function(c){ return c.platId === state.bulkWizard.srcPlatId && c.chanId === value; });
    state.bulkWizard.srcCampId = chans.length && chans[0].campaigns.length ? chans[0].campaigns[0].id : "";
  }
  if (field === "targetPlatId") {
    var chans = flattenAllChannels().filter(function(c){ return c.platId === value; });
    state.bulkWizard.targetChanId = chans.length ? chans[0].chanId : "";

window.applyBulkWizard = function() {
  var w = state.bulkWizard;
  if (!w) return;
  var srcKey = w.srcPlatId + "||" + w.srcChanId + "||" + w.srcCampId;
  var srcEntries = state.channelEntries[srcKey];
  if (!srcEntries || !Object.keys(srcEntries).length) { alert("원본 기획전에 입력된 데이터가 없습니다."); return; }

  var targetChans = _getTargetChannelsById(w.targetPlatId);
  var targetChan = (targetChans || []).find(function(c){ return c.id === w.targetChanId; });
  if (!targetChan) { alert("대상 채널을 찾을 수 없습니다."); return; }

  var targetCampId;
  if (w.targetMode === "new") {
    var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    var existIds = (targetChan.campaigns || []).map(function(c){ return c.id; });
    targetCampId = null;
    for (var i = 0; i < letters.length; i++) { if (existIds.indexOf(letters[i]) < 0) { targetCampId = letters[i]; break; } }
    if (!targetCampId) targetCampId = "X" + Date.now();
    if (!targetChan.campaigns) targetChan.campaigns = [];
    targetChan.campaigns.push({ id: targetCampId, label: w.targetLabel || ("기획전 " + targetCampId) });
  } else {
    targetCampId = w.targetMode;
  }

  var targetKey = w.targetPlatId + "||" + w.targetChanId + "||" + targetCampId;
  var adjusted = {};
  var pct = Number(w.adjustValue) || 0;
  Object.keys(srcEntries).forEach(function(pid) {
    var e = deepClone(srcEntries[pid]);
    if (e && Number(e.price)) {
      var base = Number(e.price);
      var np = w.adjustType === "pct" ? base * (1 + pct/100) : base + pct;
      e.price = Math.max(0, Math.round(np / 10) * 10);
    }
    adjusted[pid] = e;
  });

  var willOverwrite = state.channelEntries[targetKey] && Object.keys(state.channelEntries[targetKey]).length > 0;
  if (willOverwrite && !window.confirm("대상 기획전에 이미 입력된 데이터가 있습니다. 덮어쓸까요?")) return;

  state.channelEntries[targetKey] = adjusted;
  schedulePersist();
  state.bulkWizard = null;
  render();
  pushChatMessage("assistant", "✅ '" + esc(w.targetLabel || targetCampId) + "' 기획전에 " + Object.keys(adjusted).length + "개 상품을 " +
    (pct === 0 ? "원본 그대로" : (pct > 0 ? "+" : "") + pct + (w.adjustType === "pct" ? "%" : "원") + " 조정하여") + " 입력했습니다.");
};

function updateTargetMargin(v) {
  state.targetMargin = Number(v) || 0;
  schedulePersist();
  scheduleRender();
}

// 목표 마진율(t%)을 만족하는 판매가 역산.
// margin = price - C - price/11 - price*fee - 쿠폰 → price = 분자/분모
function calcTargetPrice(product, entry, feeRate, isBaby, withCoupon) {
  var t = (Number(state.targetMargin) || 0) / 100;
  var C = (Number(product.unitCost)||0) * (Number(product.qty)||0) + (Number(product.box)||0) + (Number(product.ship)||0);
  var jType = (entry && entry.sellerType) || "pct";
  var jVal = Number(entry && entry.seller) || 0;
  var denom = 1 - (1/11) - feeRate - t;
  var numer = C;
  if (jType === "pct") denom -= (jVal / 100);
  else numer += jVal;
  if (isBaby && withCoupon) numer += 5000; // 바우처쿠폰 최대치 가정
  var pType = (entry && entry.platType) || "pct";
  var pVal = Number(entry && entry.plat) || 0;
  var pShare = (Number(entry && entry.platShare) || 0) / 100;
  if (pShare > 0) {
    if (pType === "pct") denom -= (pVal / 100) * pShare;
    else numer += pVal * pShare;
  }
  if (denom <= 0.01) return null; // 구조적으로 불가능
  return Math.ceil((numer / denom) / 100) * 100; // 100원 단위 올림
}

/* 저장하지 않는 세션 전용 필드 (실수로 payload 에 섞이면 Firestore 오염) */
var SESSION_ONLY_KEYS = [
  "_copiedEntries", "_copiedLabel", "assistantOpen", "bulkWizard", "feeSimDelta",
  "activeCompareSub",
  "activeTab", "activePlatformId", "activeSubPlatId", "activeChannelId",
  "activeCampaignId", "openCategories", "addingCatDef", "newCatDraft",
  "bulkMode", "bulkValue", "bulkField", "bulkTarget",
  "activeDashPlatId", "activeDashSubPlatId", "activeDashChannelId",
  "activeDashCampaignId", "activeDashCampaignViewMode", "activeDashCampaignIdx"
];

/* Firestore 단일 문서 상한 1MiB. 여유분 남겨 900KB 에서 경고. */
var FIRESTORE_SOFT_LIMIT = 900 * 1024;

function persist() {
  var payload = JSON.stringify({
    products: state.products,
    platformDefs: state.platformDefs,
    channelEntries: state.channelEntries,
    standardPrices: state.standardPrices,
    categoryDefs: state.categoryDefs,
    calcDeletedIds: state.calcDeletedIds,
    platHiddenMap: state.platHiddenMap,
    platformOrder: state.platformOrder,
    campaignOrder: state.campaignOrder,
    shippingData: state.shippingData,
    packagingData: state.packagingData,
    activeFeeTab: state.activeFeeTab,
    standardHiddenChannels: state.standardHiddenChannels,
    deletedDefaultPlatformIds: state.deletedDefaultPlatformIds,
    deletedDefaultChannelKeys: state.deletedDefaultChannelKeys,
    targetMargin: state.targetMargin,
    salesRecords: state.salesRecords,
    marginSnapshot: state.marginSnapshot,
    chatLog: state.chatLog,
  });
  // ── 개발 안전장치: 세션 전용 키가 payload 에 섞였는지 검사 ──
  (function guardSessionKeys() {
    var obj;
    try { obj = JSON.parse(payload); } catch (e) { return; }
    var leaked = SESSION_ONLY_KEYS.filter(function (k) {
      return Object.prototype.hasOwnProperty.call(obj, k);
    });
    if (leaked.length) console.error("[저장] 세션 전용 키 누출:", leaked);
  })();

  // ── 용량 감시: Firestore 문서 상한 초과 전에 경고 ──
  var byteSize = new Blob([payload]).size;
  if (byteSize > FIRESTORE_SOFT_LIMIT) {
    console.warn("[저장] payload " + Math.round(byteSize / 1024) + "KB — Firestore 상한(1MB) 근접");
    showSaveError("데이터 " + Math.round(byteSize / 1024) + "KB · 저장 한도 근접. 미사용 기획전 정리 필요");
  }

  function finish(ok, reason) {
    setSaveLabel(ok ? "saved" : "idle");
    if (!ok) showSaveError(reason || "저장 실패 — 새로고침 전 데이터를 확인하세요");
    else clearSaveError();
  }

  if (typeof window.firebaseSave === "function") {
    window.firebaseSave(STORAGE_KEY, payload).then(function(ok) {
      if (ok) { finish(true); return; }
      console.warn("[저장] Firestore 실패, localStorage 백업 시도");
      try {
        localStorage.setItem(STORAGE_KEY, payload);
        finish(false, "서버 저장 실패 · 브라우저에만 임시 저장됨");
      } catch(e) {
        console.error("[저장] localStorage도 실패:", e);
        finish(false, "저장 실패 (서버·브라우저 모두) — 창을 닫지 마세요");
      }
    });
  } else {
    try { localStorage.setItem(STORAGE_KEY, payload); finish(true); }
    catch(e) { console.error("[저장] localStorage 실패:", e); finish(false, "브라우저 저장 공간 부족"); }
  }
  // 항상 localStorage에도 백업 저장
  try { localStorage.setItem(STORAGE_KEY, payload); } catch(e) {}
}

/* 저장 오류를 화면 우하단에 표시 (기존엔 콘솔에만 있어 사용자가 데이터 유실을 몰랐음) */

function loadState(callback) {
  var OLD_KEYS = ["margin_dashboard_v7", "margin_dashboard_v6", "margin_dashboard_v5"];

  function tryParse(val) {
    if (!val) return null;
    try { return JSON.parse(val); } catch(e) { return null; }
  }

  function loadLocalFallback() {
    // 현재 키로 먼저 시도
    var val = tryParse(localStorage.getItem(STORAGE_KEY));
    if (val) { callback(val); return; }
    // 이전 키로 마이그레이션 시도
    for (var i = 0; i < OLD_KEYS.length; i++) {
      val = tryParse(localStorage.getItem(OLD_KEYS[i]));
      if (val) { callback(val); return; }
    }
    callback(null);
  }

  if (typeof window.firebaseLoad === "function") {
    window.firebaseLoad(STORAGE_KEY).then(function(val) {
      var parsed = tryParse(val);
      if (parsed) { callback(parsed); return; }
      // 이전 Firestore 키 마이그레이션 시도
      var tryOld = function(idx) {
        if (idx >= OLD_KEYS.length) { loadLocalFallback(); return; }
        window.firebaseLoad(OLD_KEYS[idx]).then(function(oldVal) {
          var oldParsed = tryParse(oldVal);
          if (oldParsed) { callback(oldParsed); return; }
          tryOld(idx + 1);
        }).catch(function(){ tryOld(idx + 1); });
      };
      tryOld(0);
    }).catch(function(){ loadLocalFallback(); });
  } else { loadLocalFallback(); }
}

/* ────────────────────────────────────────────────────────────
   메가마트 직매입 (B2B 공급) 마진 계산
   - 공급가는 부가세 포함
   - 쿠폰은 "메가마트 판매가" 기준으로 계산 (공급가 아님) — 데일리홈 부담
   - 택배비/물류비는 메가마트 부담 → 0
   마진 = 공급가 − 원가 − 부가세 − 쿠폰할인 − 수수료 − 행사할인
   마진율 = 마진 ÷ 공급가
   ──────────────────────────────────────────────────────────── */
function calcSupplyMetrics(product, entry, feeRate) {
  var supply     = Number(entry && entry.supply)     || 0; // 공급가(VAT 포함)
  var retail     = Number(entry && entry.retail)     || 0; // 메가마트 판매가
  var couponPct  = Number(entry && entry.coupon)     || 0; // 쿠폰 %
  var couponType = (entry && entry.couponType) || "pct";
  var feePct     = (entry && entry.supplyFee !== undefined && entry.supplyFee !== "")
                    ? Number(entry.supplyFee) / 100
                    : (Number(feeRate) || 0);
  var eventDisc  = Number(entry && entry.eventDisc)  || 0; // 행사 할인

  var unitCost = Number(product.unitCost) || 0;
  var qty      = Number(product.qty)      || 0;
  var cost     = unitCost * qty;

  var supplyPerUnit = qty > 0 ? supply / qty : 0;
  var vat    = supply > 0 ? Math.round(supply / 11) : 0;
  var feeAmt = Math.round(supply * feePct);
  var couponAmt = couponType === "fixed"
    ? Math.round(couponPct)
    : Math.round(retail * (couponPct / 100));
  var shipAmt = 0; // 메가마트 부담

  var margin = supply - cost - vat - couponAmt - feeAmt - eventDisc;
  var marginRate = supply > 0 ? margin / supply : 0;

  return {
    isSupply: true,
    supply: supply, retail: retail, supplyPerUnit: supplyPerUnit,
    unitCost: unitCost, qty: qty, cost: cost,
    vat: vat, feeAmt: feeAmt, feePct: feePct,
    couponAmt: couponAmt, couponPct: couponPct, couponType: couponType,
    eventDisc: eventDisc, shipAmt: shipAmt,
    margin: margin, marginRate: marginRate,
    price: supply, ending: supply // 공통 인터페이스 호환
  };
}

function calcMetrics(product, entry, feeRate) {
  var price = Number(entry && entry.price) || 0;
  var sellerPct  = Number(entry && entry.seller)    || 0;
  var sellerCap  = Number(entry && entry.sellerCap) || 0; // 자사 쿠폰 최대금액 (0=제한없음)
  var platPct    = Number(entry && entry.plat)       || 0;
  var platCap    = Number(entry && entry.platCap)    || 0; // 플랫폼 쿠폰 최대금액 (0=제한없음)
  var platShare  = Number(entry && entry.platShare)  || 0; // 데일리홈 부담 % (0~100)

  var unitCost = Number(product.unitCost) || 0;
  var qty      = Number(product.qty)      || 0;
  var cost     = unitCost * qty;
  var box      = Number(product.box)  || 0;
  var ship     = Number(product.ship) || 0;
  var pricePerUnit = qty > 0 ? price / qty : 0;
  var vat    = price > 0 ? Math.round((price / 1.1) * 0.1) : 0;
  var feeAmt = Math.round(price * feeRate);

  // 쿠폰 타입: pct=정률(%), fixed=정액(원)
  var sellerType = (entry && entry.sellerType) || "pct";
  var platType   = (entry && entry.platType)   || "pct";

  // 자사 쿠폰
  var sellerAmt;
  if (sellerType === "fixed") {
    sellerAmt = Math.round(Number(sellerPct) || 0); // 정액: 입력값 그대로
  } else {
    var sellerRaw = Math.round(price * (sellerPct / 100));
    sellerAmt = (sellerCap > 0) ? Math.min(sellerRaw, sellerCap) : sellerRaw;
  }

  // 플랫폼 쿠폰
  var platAmt;
  if (platType === "fixed") {
    platAmt = Math.round(Number(platPct) || 0); // 정액: 입력값 그대로
  } else {
    var platRaw = Math.round(price * (platPct / 100));
    platAmt = (platCap > 0) ? Math.min(platRaw, platCap) : platRaw;
  }

  // 플랫폼 쿠폰 중 데일리홈 부담분 (마진반영), 플랫폼 부담분 (마진미반영)
  var platSellerAmt = Math.round(platAmt * (platShare / 100)); // 데일리홈 부담 → 마진반영
  var platPlatAmt   = platAmt - platSellerAmt;                 // 플랫폼 부담 → 마진미반영

  var couponTotal = sellerAmt + platAmt;
  // 마진 = 판매가 - 원가 - 박스 - 택배 - 부가세 - 수수료 - 데일리홈쿠폰 - 플랫폼쿠폰 중 데일리홈부담분
  var margin     = price - cost - box - ship - vat - feeAmt - sellerAmt - platSellerAmt;
  var marginRate = price > 0 ? margin / price : 0;
  var ending     = price - sellerAmt - platAmt;

  return {
    price: price, unitCost: unitCost, qty: qty, pricePerUnit: pricePerUnit,
    cost: cost, box: box, ship: ship, vat: vat, feeAmt: feeAmt,
    sellerAmt: sellerAmt, sellerCap: sellerCap,
    platAmt: platAmt, platCap: platCap,
    platSellerAmt: platSellerAmt, platPlatAmt: platPlatAmt, platShare: platShare,
    couponTotal: couponTotal, margin: margin, marginRate: marginRate, ending: ending
  };
}

function calcBabyVoucherMetrics(product, entry, feeRate, withCoupon) {
  var price = Number(entry && entry.price) || 0;
  var sellerPct  = Number(entry && entry.seller)    || 0;
  var sellerCap  = Number(entry && entry.sellerCap) || 0;
  var platPct    = Number(entry && entry.plat)       || 0;
  var platCap    = Number(entry && entry.platCap)    || 0;
  var platShare  = Number(entry && entry.platShare)  || 0;
  var sellerType = (entry && entry.sellerType) || "pct";
  var platType   = (entry && entry.platType)   || "pct";
  var unitCost = Number(product.unitCost) || 0;
  var qty = Number(product.qty) || 0;
  var cost = unitCost * qty;
  var box = Number(product.box) || 0;
  var ship = Number(product.ship) || 0;
  var vat = price > 0 ? Math.round((price / 1.1) * 0.1) : 0;
  var feeAmt = Math.round(price * feeRate);
  // 자사 쿠폰
  var sellerRaw = sellerType === "fixed" ? Math.round(Number(sellerPct)||0) : Math.round(price * (sellerPct / 100));
  var sellerAmt = (sellerType !== "fixed" && sellerCap > 0) ? Math.min(sellerRaw, sellerCap) : sellerRaw;
  // 바우처 쿠폰 (플랫폼 부담, 마진 반영)
  var voucherDiscount = 0;
  if (withCoupon && price >= 10000) {
    voucherDiscount = Math.min(Math.round(price * 0.5), 5000);
  }
  // 플랫폼 쿠폰 (별도 입력)
  var platRaw = platType === "fixed" ? Math.round(Number(platPct)||0) : Math.round(price * (platPct / 100));
  var platAmt = (platType !== "fixed" && platCap > 0) ? Math.min(platRaw, platCap) : platRaw;
  var platSellerAmt = Math.round(platAmt * (platShare / 100)); // 데일리홈 부담 → 마진반영
  var platPlatAmt   = platAmt - platSellerAmt;                 // 플랫폼 부담 → 마진미반영
  var ending = price - sellerAmt - voucherDiscount - platAmt;
  // 마진: 바우처쿠폰 + 데일리홈쿠폰 + 플랫폼쿠폰 진심부담분 반영
  var margin = price - cost - box - ship - vat - feeAmt - sellerAmt - voucherDiscount - platSellerAmt;
  var marginRate = price > 0 ? margin / price : 0;
  return { price: price, cost: cost, box: box, ship: ship, vat: vat, feeAmt: feeAmt,
    sellerAmt: sellerAmt, voucherDiscount: voucherDiscount,
    platAmt: platAmt, platSellerAmt: platSellerAmt, platPlatAmt: platPlatAmt, platShare: platShare,
    margin: margin, marginRate: marginRate, ending: ending };
}

function marginTier(rate) {
  if (rate >= 0.15) return "good";
  if (rate >= 0.10) return "warn";

function badgeHTML(rate) {
  var tier = marginTier(rate);
  var glyph = tier === "good" ? "✓" : "⚠";
  return '<span class="badge badge-' + tier + '">' + glyph + " " + pct1(rate) + "</span>";
}

/* Enter 키 = 같은 열의 다음 제품 입력창으로 이동 (엑셀식 세로 진행) */
(function initEnterNav() {
  if (window._enterNavInit) return;
  window._enterNavInit = true;
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Enter") return;
    var t = e.target;
    if (!t || !t.getAttribute || !t.getAttribute("data-nav")) return;
    e.preventDefault();
    var nav = t.getAttribute("data-nav");
    var all = Array.prototype.slice.call(document.querySelectorAll('input[data-nav="' + nav + '"]'));
    var idx = all.indexOf(t);
    if (idx >= 0 && idx < all.length - 1) {
      all[idx + 1].focus();
      if (all[idx + 1].select) all[idx + 1].select();
    } else if (t.blur) { t.blur(); }
  });
})();
/* 사용자가 입력 중인지 판정. 입력 중 전체 render() 는 innerHTML 통째 교체라
   포커스·커서위치·IME 조합이 전부 날아간다. → 입력이 끝날 때까지 렌더를 미룬다. */
function isUserTyping() {
  var el = document.activeElement;
  if (!el) return false;
  var tag = (el.tagName || "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
}

function scheduleRender() {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(function tick() {
    // 입력 중이면 렌더를 실행하지 않고 뒤로 미룬다 (무한 대기 아님 — blur 시 즉시 진행)
    if (isUserTyping()) { renderTimer = setTimeout(tick, 400); return; }
    renderTimer = null;
    render();
  }, 600);
}
function schedulePersist() {
  setSaveLabel("saving");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 500);
}

function loadFromLocalStorage() {

function costDragStart(e, prodId) {
  state.draggedProdId = prodId;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", prodId);
  setTimeout(function() {
    var el = document.querySelector('.cost-row[data-prod-id="' + prodId + '"]');
    if (el) el.classList.add("dragging");
  }, 0);
}
function costDragOver(e, prodId) {
  if (!state.draggedProdId || state.draggedProdId === prodId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".cost-row.drag-over").forEach(function(el) { el.classList.remove("drag-over"); });
  var el = document.querySelector('.cost-row[data-prod-id="' + prodId + '"]');
  if (el) el.classList.add("drag-over");
}
function costDragLeave(prodId) {
  var el = document.querySelector('.cost-row[data-prod-id="' + prodId + '"]');
  if (el) el.classList.remove("drag-over");
}
function costDrop(e, targetProdId) {
  e.preventDefault();
  var fromId = state.draggedProdId;
  if (!fromId || fromId === targetProdId) return;
  var fromIdx = -1, toIdx = -1;
  for (var i = 0; i < state.products.length; i++) {
    if (state.products[i].id === fromId) fromIdx = i;
    if (state.products[i].id === targetProdId) toIdx = i;
  }
  if (fromIdx < 0 || toIdx < 0) return;
  var item = state.products.splice(fromIdx, 1)[0];
  state.products.splice(toIdx, 0, item);
  state.draggedProdId = null;
  schedulePersist();
  render();
}
function costDragEnd() {
  state.draggedProdId = null;
  document.querySelectorAll(".cost-row.dragging").forEach(function(el) { el.classList.remove("dragging"); });
  document.querySelectorAll(".cost-row.drag-over").forEach(function(el) { el.classList.remove("drag-over"); });
}

function _calcSetUnitCost() {
  if (!state.newSetDraft) return 0;
  return state.newSetDraft.components.reduce(function(sum, comp) {
    var p = state.products.find(function(pp){ return pp.id === comp.prodId; });
    return sum + (p ? (Number(p.unitCost)||0) * (Number(p.qty)||0) : 0);
  }, 0);
}
function _recalcSetCost() {
  if (!state.newSetDraft) return;
  state.newSetDraft._autoUnitCost = _calcSetUnitCost();
  var maxBox = 0, maxShip = 0;
  state.newSetDraft.components.forEach(function(comp) {
    var p = state.products.find(function(pp){ return pp.id === comp.prodId; });
    if (p) { maxBox = Math.max(maxBox, Number(p.box)||0); maxShip = Math.max(maxShip, Number(p.ship)||0); }
  });
  if (maxBox > 0 && (!state.newSetDraft.box || state.newSetDraft.box === "0")) state.newSetDraft.box = String(maxBox);
  if (maxShip > 0 && (!state.newSetDraft.ship || state.newSetDraft.ship === "0")) state.newSetDraft.ship = String(maxShip);
}

  }).join("") + "</nav>";

function downloadCalcExcel() {
  var platId = getWorkingPlatId();
  var chanId = state.activeChannelId;
  var campId = state.activeCampaignId || "A";
  var chan = state.platformDefs
    .flatMap(function(p) { return p.isOtherGroup ? (p.subPlatforms||[]) : [p]; })
    .flatMap(function(p) { return p.channels||[]; })
    .find(function(c) { return c.id === chanId; });
  
  if (!chan) return alert("채널 정보를 찾을 수 없습니다.");
  
  var campLabel = (chan.campaigns||[]).find(function(c){return c.id===campId;});
  var tabName = state.activeTab === "standard" ? "상시판매가" : ("마진계산_" + chan.label + "_" + (campLabel ? campLabel.label : campId));
  // 엑셀 시트명은 31자 제한 및 일부 특수문자 사용 불가
  tabName = tabName.replace(/[\\/?*:\[\]]/g, "_").slice(0, 31);
  var rows = [["카테고리", "제품명", "규격", "행사가", "데일리홈쿠폰", "플랫폼쿠폰", "최종가", "마진", "마진율"]];
  
  state.categoryDefs.forEach(function(catDef) {
    state.products.filter(function(p){ return p.category === catDef.id && state.calcDeletedIds.indexOf(p.id) < 0; }).forEach(function(p) {
      var key = state.activeTab === "standard" ? (platId + "||" + chanId) : (platId + "||" + chanId + "||" + campId);
      var dataSource = state.activeTab === "standard" ? state.standardPrices : state.channelEntries;
      var entry = (dataSource[key] || {})[p.id] || {};
      var m = chan.isBaby
        ? calcBabyVoucherMetrics(p, entry, chan.feeRate, !!chan.babyWithCoupon)
        : calcMetrics(p, entry, chan.feeRate);
      rows.push([
        catDef.label, p.name, p.size,
        m.price || "-", entry.seller || "-", entry.plat || "-",
        m.ending || "-", m.margin || "-", (m.marginRate*100).toFixed(2) + "%" || "-"
      ]);
    });
  });
  
  if (rows.length === 1) {
    alert("다운로드할 데이터가 없습니다.");
    return;
  }
  
  try {
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tabName);
    XLSX.writeFile(wb, "데일리홈_" + safeFilePart(tabName) + ".xlsx");
  } catch(e) {
    alert("엑셀 다운로드 중 오류가 발생했습니다: " + e.message);
  }
}

function downloadCostExcel() {
  var rows = [["카테고리", "제품명", "규격", "단위원가", "수량", "박스비", "택배비", "합계원가"]];
  state.categoryDefs.forEach(function (catDef) {
    state.products.filter(function (p) { return p.category === catDef.id; }).forEach(function (p) {
      rows.push([catDef.label, p.name, p.size, p.unitCost, p.qty, p.box, p.ship, (Number(p.unitCost) || 0) * (Number(p.qty) || 0)]);
    });
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();

// 종합대시보드 엑셀 다운로드
function downloadDashboardExcel() {
  var rows = [["플랫폼", "채널", "기획전", "제품명", "규격", "행사가", "최종가", "마진", "마진율"]];
  state.platformDefs.forEach(function(plat) {
    var platList = plat.isOtherGroup ? (plat.subPlatforms || []) : [plat];
    platList.forEach(function(p) {
      (p.channels || []).forEach(function(chan) {
        (chan.campaigns || []).forEach(function(camp) {
          var key = p.id + "||" + chan.id + "||" + camp.id;
          var entries = state.channelEntries[key] || {};
          Object.keys(entries).forEach(function(pid) {
            var e = entries[pid];
            var prod = state.products.find(function(pr){ return pr.id === pid; });
            if (!prod || !e || !Number(e.price)) return;
            var m = chan.isBaby
              ? calcBabyVoucherMetrics(prod, e, chan.feeRate, !!chan.babyWithCoupon)
              : calcMetrics(prod, e, chan.feeRate);
            rows.push([
              p.label, chan.label, camp.label, prod.name, prod.size,
              m.price || "-", m.ending || "-", m.margin || "-", (m.marginRate*100).toFixed(2) + "%"
            ]);
          });
        });
      });
    });
  });
  if (rows.length === 1) { alert("다운로드할 데이터가 없습니다."); return; }
  try {
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "종합대시보드");
    XLSX.writeFile(wb, "데일리홈_종합대시보드.xlsx");
  } catch(e) {
    alert("엑셀 다운로드 중 오류가 발생했습니다: " + e.message);
  }
}

function downloadExcel() {
  if (typeof XLSX === "undefined") {
    alert("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.");
    return;
  }
  if (state.activeTab === "calc") downloadCalcExcel();
  else if (state.activeTab === "standard") downloadCalcExcel(); // 상시판매가는 마진계산과 동일한 구조
  else if (state.activeTab === "dashboard") downloadDashboardExcel();
  else if (state.activeTab === "compare") {
    // 마진비교 탭은 세부 탭에 따라 내려받을 내용이 달라진다.
    var _sub = state.activeCompareSub || "overview";
    if (_sub === "analysis") downloadAnalysisExcel();
    else if (_sub === "forecast") alert("예측 탭은 안내 화면이라 엑셀로 내려받을 내용이 없습니다.");
    else downloadDashboardExcel();
  }
  else if (state.activeTab === "cost") downloadCostExcel();
  else if (state.activeTab === "fee") downloadFeeExcel();
  else alert("이 탭은 엑셀 다운로드를 지원하지 않습니다.");
}

/* 분석 탭 → 4개 시트로 내보내기 */
function downloadAnalysisExcel() {
  var recs = collectAnalysisRecords();
  if (!recs.length) { alert("분석할 데이터가 없습니다. 마진계산 탭에서 판매가를 먼저 입력해주세요."); return; }
  var wb = XLSX.utils.book_new();

  var cs = analyzeCostStructure(recs);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    cs.parts.map(function (p) {
      return { "구분": p.key, "금액(원)": Math.round(p.amt), "판매가 대비": (p.pct * 100).toFixed(2) + "%" };
    })), "마진구조");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    analyzeLossDrivers(recs).map(function (d) {
      return {
        "채널": d.label, "항목수": d.n, "마진율": (d.rate * 100).toFixed(1) + "%",
        "주요원인1": d.top[0] ? d.top[0].key + " " + (d.top[0].pct * 100).toFixed(1) + "%" : "",
        "주요원인2": d.top[1] ? d.top[1].key + " " + (d.top[1].pct * 100).toFixed(1) + "%" : "",
        "주요원인3": d.top[2] ? d.top[2].key + " " + (d.top[2].pct * 100).toFixed(1) + "%" : ""
      };
    })), "손실원인");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    analyzeTargetGap(recs).map(function (g) {
      return {
        "채널": g.label, "상품": g.prod, "현재가": g.price,
        "마진율": (g.rate * 100).toFixed(1) + "%",
        "권장가": g.need || "구조상 불가", "인상액": g.gap || ""
      };
    })), "목표미달");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    analyzePriceVariance(recs).map(function (v) {
      return {
        "상품": v.name, "채널수": v.n,
        "최고 마진율": (v.maxR * 100).toFixed(1) + "%", "최고 채널": v.hiLabel,
        "최저 마진율": (v.minR * 100).toFixed(1) + "%", "최저 채널": v.loLabel,
        "마진 편차": (v.spreadR * 100).toFixed(1) + "%",
        "최저가": v.minP, "최고가": v.maxP
      };
    })), "플랫폼편차");

  XLSX.writeFile(wb, "데일리홈_분석_" + safeFilePart(new Date().toISOString().slice(0, 10)) + ".xlsx");
}

            '<span style="font-size:10px;color:var(--muted);white-space:nowrap;">컨테이너</span>' +
            '<input class="num-input-sm" type="text" style="width:70px;font-size:11px;padding:2px 6px;" value="' + esc(p.containerInfo || "") + '" placeholder="예)1차,2차" oninput="updateProductCost(\'' + p.id + '\',\'containerInfo\',this.value)" />' +
          '</div>' +

        '<div class="cost-cell"><div class="input-suffix"><input class="num-input-sm" type="number" value="' + p.box + '" oninput="updateProductCost(\'' + p.id + '\',\'box\',this.value)" /><span>원</span></div></div>' +

          '<div class="cost-cell">박스비(원)</div>' +

      '</div>' +
      body +

  }).join("");

  return '<div class="view-stack">' +
    '<div class="view-header"><div class="view-intro">ℹ️ 단위원가·박스비·택배비를 수정하면 모든 플랫폼·기획전의 마진 계산에 자동으로 반영됩니다.</div>' + renderDownloadBtn() + '</div>' +
    renderBulkBar("cost") +
    renderAddCatForm() +
    sections +
  '</div>';
}
/* (중복 함수 제거됨: getActivePlatform/getActiveChannel/getChannelEntries/getChannelEntry/selectPlatform v2
   — 앞부분의 서브플랫폼 지원 버전이 정본) */
// 상시판매가에서만 채널 숨김 (마진계산은 영향 없음)
function deleteStandardChannel(platId, chanId) {
  if (!state.standardHiddenChannels) state.standardHiddenChannels = {};
  if (!state.standardHiddenChannels[platId]) state.standardHiddenChannels[platId] = [];
  state.standardHiddenChannels[platId].push(chanId);
  schedulePersist();
  render();
}
// 채널 이름 수정 (팝업)
function editChannelName(platId, chanId) {
  var chans = _getTargetChannels(platId);
  var chan = (chans || []).find(function(c){ return c.id === chanId; });
  if (!chan) return;
  var newName = window.prompt('채널 이름을 변경하세요:', chan.label);
  if (newName && newName.trim()) {
    chan.label = newName.trim();
    schedulePersist();
    render();
  }
}

// 엔트리 업데이트
function updateChannelEntry(platId, chanId, campId, prodId, field, value) {
  var key = platId + "||" + chanId + "||" + (campId || "A");
  if (!state.channelEntries[key]) state.channelEntries[key] = {};
  var prev = state.channelEntries[key][prodId] || {};
  var next = Object.assign({}, prev);
  next[field] = value;
  state.channelEntries[key][prodId] = next;
  schedulePersist();
  // 타입 토글(정률↔정액)은 셀 레이아웃이 바뀌므로 전체 재렌더
  if (field === "sellerType" || field === "platType") {
    render();
  } else {
    // 커서 사라지는 버그 해결: render를 더 오래 지연시킴
    setTimeout(function() {
      patchEntryRow(platId, chanId, campId, prodId);
    }, 100);
  }
}

// 상시판매가 엔트리 업데이트
function updateStandardEntry(platId, chanId, prodId, field, value) {
  var key = platId + "||" + chanId;
  if (!state.standardPrices[key]) state.standardPrices[key] = {};
  var prev = state.standardPrices[key][prodId] || {};
  var next = Object.assign({}, prev);
  next[field] = value;
  state.standardPrices[key][prodId] = next;
  schedulePersist();
  if (field === "sellerType" || field === "platType") {
    render();
  } else {
    // 커서 사라지는 버그 해결: render를 더 오래 지연시킴
    setTimeout(function() {
      patchEntryRow(platId, chanId, null, prodId, true); // true = isStandard
    }, 100);
  }
}

function renderPlatformTabs() {
  var tabs = state.platformDefs.map(function(plat) {
    var active = plat.id === state.activePlatformId;
    return '<button type="button" class="platform-tab ' + (active ? "platform-tab-active" : "") + '" data-plat-id="' + esc(plat.id) + '" onclick="selectPlatform(\'' + esc(plat.id) + '\')">' +
      esc(plat.label) +
    '</button>';
  }).join("");
  tabs += '<button type="button" class="platform-tab" style="color:var(--brass-deep);border-color:#EDDCAE;background:var(--gold-bg);" onclick="addPlatform()">+ 플랫폼</button>';
  return '<div class="platform-tabrow" style="overflow-x:auto;flex-wrap:nowrap;">' + tabs + '</div>';
}

function renderChannelTabs(plat) {
  var tabs = plat.channels.map(function(chan) {
    var active = chan.id === state.activeChannelId;
    var isBaby = chan.isBaby;
    var color = isBaby ? "#B5651D" : "#3F5E78";
    var bg = isBaby ? "#FFF1E6" : "#E7EEF2";
    return '<button type="button" class="camp-tab ' + (active ? "camp-tab-active" : "") + '" style="--tab-color:' + color + ';--tab-bg:' + bg + ';" onclick="selectChannel(\'' + esc(chan.id) + '\')">' +
      (isBaby ? "🍼 " : "") +
      '<span class="camp-tab-label">' + esc(chan.label) + '</span>' +
      (plat.channels.length > 1 ? '<span class="camp-tab-del" onclick="event.stopPropagation();deleteChannel(\'' + esc(plat.id) + '\',\'' + esc(chan.id) + '\')">✕</span>' : '') +
    '</button>';
  }).join("");
  tabs += '<button type="button" class="camp-tab camp-tab-add" onclick="addChannel(\'' + esc(plat.id) + '\')">+ 추가</button>';
  return '<div class="camp-tabrow">' + tabs + '</div>';
}

      '<div class="config-field">' +

        '<input class="text-input" value="' + esc(chan.label) + '" placeholder="채널명 입력" ' +

      '</div>' +
    '</div>';

  // 제휴바우처 쿠폰 안내 (isBaby일 때)

    babyInfo = '<div class="voucher-coupon-box">' +

      '첫구매 웰컴 쿠폰 50% 할인 1장 (최소 10,000원 이상 주문 시, 최대 5,000원 할인)<br>' +
      '<span style="font-size:11px;color:#B5651D;">※ 제휴 쿠폰은 플랫폼 부담이므로 마진 계산에는 미반영, 엔딩가에만 표시됩니다.</span>' +

  }

  var legend = '<div class="calc-legend">' +

    '<span><span class="tag-calc">계산</span>수식으로 자동 계산된 값</span>' +

    return renderChannelCategorySection(catDef, platId, chanId, feeRate, isBaby, withCoupon);

  return configBar + babyInfo + legend +

function renderChannelCategorySection(catDef, platId, chanId, feeRate, isBaby, withCoupon, campId, isStandard, isSupply) {
  var items = state.products.filter(function(p){
    return p.category === catDef.id &&
           state.calcDeletedIds.indexOf(p.id) < 0
  });
  if (items.length === 0) return "";
  var open = state.openCategories[catDef.id] !== false;

  var rows = items.map(function(p) {
    var key = isStandard ? (platId + "||" + chanId) : (platId + "||" + chanId + "||" + (campId || "A"));
    var dataSource = isStandard ? state.standardPrices : state.channelEntries;
    var entries = dataSource[key] || {};
    var entry = entries[p.id] || {};
    var m = isSupply
      ? calcSupplyMetrics(p, { supply: entry.supply, retail: entry.retail, coupon: entry.coupon,
          couponType: entry.couponType, supplyFee: entry.supplyFee, eventDisc: entry.eventDisc }, feeRate)
      : (isBaby
        ? calcBabyVoucherMetrics(p, { price: entry.price, seller: entry.seller, sellerCap: entry.sellerCap,
            sellerType: entry.sellerType, plat: entry.plat, platCap: entry.platCap, platShare: entry.platShare, platType: entry.platType }, feeRate, withCoupon)
        : calcMetrics(p, { price: entry.price, seller: entry.seller, sellerCap: entry.sellerCap,
                           sellerType: entry.sellerType, plat: entry.plat, platCap: entry.platCap, platShare: entry.platShare, platType: entry.platType }, feeRate));
    var hasPrice = isSupply ? (m.supply > 0) : (m.price > 0);
    var idBase = isStandard 
      ? ("e-std-" + platId + "-" + chanId + "-" + p.id)
      : ("e-" + platId + "-" + chanId + "-" + (campId||"A") + "-" + p.id);

    function upd(field) {
      if (isStandard) {
        return "updateStandardEntry('" + esc(platId) + "','" + esc(chanId) + "','" + p.id + "','" + field + "',this.value)";
      } else {
        return "updateChannelEntry('" + esc(platId) + "','" + esc(chanId) + "','" + esc(campId||"A") + "','" + p.id + "','" + field + "',this.value)";
      }

        '<input type="number" class="num-input" style="font-size:10px;color:var(--muted);" value="' + (entry.sellerCap !== undefined ? esc(entry.sellerCap) : "") + '" placeholder="최대" ' +

    var sellerCell = '<div class="input-suffix input-suffix-gold" style="flex-direction:column;gap:2px;height:auto;padding:4px 6px;min-width:100px;">' +
      '<div style="display:flex;gap:3px;margin-bottom:1px;">' +
        '<button type="button" onclick="' + upd("sellerType").replace(/this\.value/,"'pct'") + '" style="font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid ' + (jType==="pct"?"#B5651D":"#E0D0A0") + ';background:' + (jType==="pct"?"#B5651D":"transparent") + ';color:' + (jType==="pct"?"#fff":"#B5651D") + ';cursor:pointer;">정률%</button>' +
        '<button type="button" onclick="' + upd("sellerType").replace(/this\.value/,"'fixed'") + '" style="font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid ' + (jType==="fixed"?"#B5651D":"#E0D0A0") + ';background:' + (jType==="fixed"?"#B5651D":"transparent") + ';color:' + (jType==="fixed"?"#fff":"#B5651D") + ';cursor:pointer;">정액원</button>' +

          'oninput="' + upd("seller") + '" /><span style="font-size:11px;">' + jUnit + '</span></div>' +
      jCap +
    '</div>';

    // 플랫폼 쿠폰 셀: % + 최대금액 + 데일리홈부담%
    var platCell;
    if (isBaby) {

    (otherRows ?

function updateFeeRowLabel(platId, value) {
  var plat = state.platformDefs.find(function(p){ return p.id === platId; });
  if (plat) { updatePlatformLabel(platId, value); return; }
  updateSubPlatLabel(platId, value);
}
// 채널의 상시판매가/기획전 구분을 직접 변경 (라벨 추정이 틀린 경우 수동 수정용)
function updateChannelFeeType(platId, chanId, value) {
  var chans = _getTargetChannels(platId);
  var chan = (chans || []).find(function(c){ return c.id === chanId; });
  if (chan) { chan.feeType = value; schedulePersist(); render(); }
}
// 전체 플랫폼 × 채널 마진율 집계 (종합 비교용)
function collectChannelStats() {
  var rows = [];
  function processChannels(navPlatId, navSubId, displayLabel, entryPlatId, channels) {
    (channels || []).forEach(function(chan) {
      var rates = [], total = 0;
      (chan.campaigns || []).forEach(function(camp) {
        var key = entryPlatId + "||" + chan.id + "||" + camp.id;
        Object.keys(state.channelEntries[key] || {}).forEach(function(pid) {
          var e = (state.channelEntries[key] || {})[pid];
          var prod = state.products.find(function(pr){ return pr.id === pid; });
          if (!prod || !e || !Number(e.price)) return;
          total++;
          var m = chan.isBaby
            ? calcBabyVoucherMetrics(prod, {price:e.price,seller:e.seller}, chan.feeRate, !!chan.babyWithCoupon)
            : calcMetrics(prod, {price:e.price,seller:e.seller,sellerType:e.sellerType,plat:e.plat,platCap:e.platCap,platType:e.platType}, chan.feeRate);
          rates.push(m.marginRate);
        });
      });
      if (total > 0) {
        var avg = rates.reduce(function(a,b){ return a+b; }, 0) / rates.length;
        var min = Math.min.apply(null, rates);
        var max = Math.max.apply(null, rates);
        rows.push({
          navPlatId: navPlatId, navSubId: navSubId,
          label: displayLabel, chanLabel: chan.label,
          avg: avg, min: min, max: max, count: total
        });
      }
    });
  }
  state.platformDefs.forEach(function(p) {
    if (p.isOtherGroup) {
      (p.subPlatforms || []).forEach(function(sub) {
        processChannels(p.id, sub.id, "기타·" + sub.label, sub.id, sub.channels);
      });
    } else {
      processChannels(p.id, null, p.label, p.id, p.channels);
    }
  });
  return rows;
}

window.jumpToDashChannel = function(platId, subId) {
  state.activeDashPlatId = platId;
  state.activeDashSubPlatId = subId || "";
  // 마진비교/이상알림/분석 탭에서 클릭한 경우 종합 대시보드로 이동해야 상세가 보인다.
  if (state.activeTab !== "dashboard") state.activeTab = "dashboard";
  render();
  var el = document.querySelector(".platform-tabrow");
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
};

// 종합 비교 리더보드 렌더 (전체 플랫폼 × 채널 마진율 한눈에 비교)
function renderDashOverview() {
  var rows = collectChannelStats();
  if (!rows.length) {
    return '<div class="empty-state" style="margin-bottom:20px;">📋 마진계산 탭에서 판매가를 입력하면 여기에 전체 플랫폼·채널 마진율 비교가 표시됩니다.</div>';
  }
  rows.sort(function(a, b) { return b.avg - a.avg; });

  var best = rows[0], worst = rows[rows.length - 1];
  var overallAvg = rows.reduce(function(s, r){ return s + r.avg; }, 0) / rows.length;

  var summaryHtml = '<div class="kpi-grid" style="margin-bottom:16px;">' +
    '<div class="kpi-card" style="border-top-color:#3F5E78;">' +
      '<div class="kpi-label" style="color:#3F5E78;">전체 평균 마진율</div>' +
      '<div class="kpi-number mono">' + pct1(overallAvg) + '</div>' +
      '<div class="kpi-sub">' + rows.length + '개 채널 · ' + rows.reduce(function(s,r){return s+r.count;},0) + '개 항목</div>' +
    '</div>' +
    '<div class="kpi-card" style="border-top-color:#2F6B45;cursor:pointer;" onclick="jumpToDashChannel(\'' + esc(best.navPlatId) + '\',\'' + esc(best.navSubId||"") + '\')">' +
      '<div class="kpi-label" style="color:#2F6B45;">최고 마진 채널</div>' +
      '<div class="kpi-number mono" style="color:#2F6B45;">' + pct1(best.avg) + '</div>' +
      '<div class="kpi-sub">' + esc(best.label) + ' · ' + esc(best.chanLabel) + '</div>' +
    '</div>' +
    '<div class="kpi-card" style="border-top-color:#9C3B27;cursor:pointer;" onclick="jumpToDashChannel(\'' + esc(worst.navPlatId) + '\',\'' + esc(worst.navSubId||"") + '\')">' +
      '<div class="kpi-label" style="color:#9C3B27;">최저 마진 채널</div>' +
      '<div class="kpi-number mono" style="color:#9C3B27;">' + pct1(worst.avg) + '</div>' +
      '<div class="kpi-sub">' + esc(worst.label) + ' · ' + esc(worst.chanLabel) + '</div>' +
    '</div>' +
  '</div>';

  var maxScale = Math.max(0.30, Math.max.apply(null, rows.map(function(r){ return r.avg; })) * 1.1);
  var listHtml = rows.map(function(r) {
    var color = r.avg >= 0.15 ? "#2F6B45" : r.avg >= 0.10 ? "#8B6000" : "#9C3B27";
    var w = Math.min(100, Math.max(2, (r.avg / maxScale) * 100));
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;" ' +
      'onclick="jumpToDashChannel(\'' + esc(r.navPlatId) + '\',\'' + esc(r.navSubId||"") + '\')">' +
      '<div style="width:150px;flex-shrink:0;font-size:12px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
        esc(r.label) + '<div style="font-size:10px;font-weight:500;color:var(--muted);">' + esc(r.chanLabel) + '</div></div>' +
      '<div style="flex:1;background:var(--paper);border-radius:99px;height:16px;overflow:hidden;">' +
        '<div style="width:' + w + '%;height:100%;background:' + color + ';border-radius:99px;"></div></div>' +
      '<div style="width:56px;flex-shrink:0;text-align:right;font-size:13px;font-weight:700;color:' + color + ';" class="mono">' + pct1(r.avg) + '</div>' +
      '<div style="width:60px;flex-shrink:0;text-align:right;font-size:10px;color:var(--muted);">' + r.count + '개</div>' +
    '</div>';
  }).join("");

  return '<div class="cat-table-wrap" style="padding:16px;margin-bottom:24px;">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">' +
      '<div style="font-size:15px;font-weight:700;color:var(--ink);">📊 전체 플랫폼 · 채널 마진율 비교</div>' +
      '<div style="font-size:11px;color:var(--muted);">클릭하면 해당 채널로 이동합니다</div>' +
    '</div>' +
    summaryHtml + listHtml +
  '</div>';
}

// 마진 이상치/급락 알림 패널
window.saveMarginSnapshot = function() {
  var rows = collectChannelStats();
  var data = {};
  rows.forEach(function(r) {
    data[r.navPlatId + "||" + (r.navSubId||"") + "||" + r.chanLabel] = r.avg;
  });
  state.marginSnapshot = { savedAt: Date.now(), data: data };
  schedulePersist();
  render();
};

function renderDashAlerts() {
  var rows = collectChannelStats();
  if (!rows.length) return "";

  var riskRows = rows.filter(function(r){ return r.avg < 0.10; }).sort(function(a,b){ return a.avg - b.avg; });

  var dropRows = [];
  if (state.marginSnapshot && state.marginSnapshot.data) {
    var snap = state.marginSnapshot.data;
    rows.forEach(function(r) {
      var key = r.navPlatId + "||" + (r.navSubId||"") + "||" + r.chanLabel;
      if (snap[key] !== undefined) {
        var delta = r.avg - snap[key];
        if (delta <= -0.03) dropRows.push({ r: r, delta: delta, prev: snap[key] });
      }
    });
    dropRows.sort(function(a, b){ return a.delta - b.delta; });
  }

  var snapInfo = state.marginSnapshot
    ? '마지막 스냅샷: ' + new Date(state.marginSnapshot.savedAt).toLocaleString('ko-KR')
    : '스냅샷을 저장하면 다음부터 마진 급락(3%p 이상 하락)을 자동으로 감지합니다.';

  var dropHtml = dropRows.map(function(d) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;" ' +
      'onclick="jumpToDashChannel(\'' + esc(d.r.navPlatId) + '\',\'' + esc(d.r.navSubId||"") + '\')">' +
      '<span style="font-size:12px;color:var(--ink);">📉 <b>' + esc(d.r.label) + ' · ' + esc(d.r.chanLabel) + '</b> — ' + pct1(d.prev) + ' → ' + pct1(d.r.avg) + '</span>' +
      '<span class="mono" style="color:#9C3B27;font-weight:700;font-size:12px;flex-shrink:0;">' + pct1(d.delta) + '</span>' +
    '</div>';
  }).join("");

  var riskHtml = riskRows.length ? riskRows.map(function(r) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;" ' +
      'onclick="jumpToDashChannel(\'' + esc(r.navPlatId) + '\',\'' + esc(r.navSubId||"") + '\')">' +
      '<span style="font-size:12px;color:var(--ink);">⚠ <b>' + esc(r.label) + ' · ' + esc(r.chanLabel) + '</b></span>' +
      '<span class="mono" style="color:#9C3B27;font-weight:700;font-size:12px;flex-shrink:0;">' + pct1(r.avg) + '</span>' +
    '</div>';
  }).join("") : '<div style="font-size:12px;color:var(--muted);padding:6px 0;">10% 미만 위험 채널이 없습니다 ✓</div>';

  return '<div class="cat-table-wrap" style="padding:16px;margin-bottom:24px;border-top:3px solid #9C3B27;">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;">' +
      '<div style="font-size:15px;font-weight:700;color:var(--ink);">🔔 마진 이상 알림</div>' +
      '<button type="button" class="reset-btn" onclick="saveMarginSnapshot()">📌 현재 상태 스냅샷 저장</button>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-bottom:12px;">' + snapInfo + '</div>' +
    (dropRows.length ? '<div style="font-size:12px;font-weight:700;color:#9C3B27;margin-bottom:4px;">🚨 급락 감지 (스냅샷 대비 3%p 이상 하락)</div>' + dropHtml : '') +
    '<div style="font-size:12px;font-weight:700;color:#9C3B27;margin:' + (dropRows.length ? '14px' : '0') + ' 0 4px;">위험 채널 (마진율 10% 미만)</div>' +
    riskHtml +
  '</div>';
}

function renderDashboard() {
  var mainPlats = state.platformDefs.filter(function(p){ return !p.isOtherGroup; });
  var otherGroup = state.platformDefs.find(function(p){ return p.isOtherGroup; });

  // 탭 목록: 주요 플랫폼 + "기타플랫폼" 1개 탭
  var tabPlats = mainPlats.slice();
  if (otherGroup) tabPlats.push(otherGroup);

  // activeDashPlatId 초기화
  var validIds = tabPlats.map(function(p){ return p.id; });
  if (!state.activeDashPlatId || validIds.indexOf(state.activeDashPlatId) < 0) {
    state.activeDashPlatId = tabPlats.length ? tabPlats[0].id : "";
  }

  var activeDef = tabPlats.find(function(p){ return p.id === state.activeDashPlatId; }) || tabPlats[0];

  // KPI 계산 (단일 플랫폼 또는 기타그룹 전체)
  function calcKpiForPlat(plat) {
    var platList = plat.isOtherGroup ? (plat.subPlatforms || []) : [plat];
    var rates = [], total = 0;
    platList.forEach(function(p) {
      (p.channels || []).forEach(function(chan) {
        (chan.campaigns || []).forEach(function(camp) {
          var key = p.id + "||" + chan.id + "||" + camp.id;
          Object.keys(state.channelEntries[key] || {}).forEach(function(pid) {
            var e = (state.channelEntries[key] || {})[pid];
            var prod = state.products.find(function(pr){ return pr.id === pid; });
            if (!prod || !e || !Number(e.price)) return;
            total++;
